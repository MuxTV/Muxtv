// Diagnostic-only init script. No production build configuration is modified.
import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

gradle.projectsEvaluated {
    def root = gradle.rootProject
    if (root.name != 'MuxTV') return
    root.tasks.register('muxtvDependencyInventory') {
        doLast {
            def sha = System.getenv('SOURCE_COMMIT')
            if (!(sha ==~ /[0-9a-f]{40}/)) {
                throw new GradleException('Missing exact SOURCE_COMMIT')
            }
            def reports = []
            int failures = 0
            [':app:tv', ':app:phone'].each { path ->
                def project = root.project(path)
                ['releaseRuntimeClasspath', 'debugUnitTestRuntimeClasspath',
                 'debugAndroidTestRuntimeClasspath'].each { name ->
                    def configuration = project.configurations.findByName(name)
                    if (configuration == null || !configuration.canBeResolved) {
                        throw new GradleException("Missing resolvable configuration: ${path}:${name}")
                    }
                    def graph = configuration.incoming.resolutionResult
                    def components = graph.allComponents.collect { component ->
                        def id = component.id
                        id instanceof ModuleComponentIdentifier ?
                            [kind: 'module', id: id.displayName, group: id.group, name: id.module, version: id.version] :
                            [kind: 'other', id: id.displayName]
                    }.sort { it.id }
                    def edges = graph.allDependencies.collect { dependency ->
                        def entry = [from: dependency.from.id.displayName,
                                     requested: dependency.requested.displayName]
                        if (dependency instanceof ResolvedDependencyResult) {
                            entry.selected = dependency.selected.id.displayName
                            entry.constraint = dependency.constraint
                        } else if (dependency instanceof UnresolvedDependencyResult) {
                            entry.unresolved = true
                            failures++
                        } else {
                            throw new GradleException('Unknown dependency result type')
                        }
                        entry
                    }.sort { a, b -> (a.from <=> b.from) ?: (a.requested <=> b.requested) ?:
                        ((a.selected ?: '') <=> (b.selected ?: '')) }
                    if (!components.any { it.kind == 'module' } || edges.isEmpty()) {
                        throw new GradleException("Empty dependency graph: ${path}:${name}")
                    }
                    reports << [project: path, configuration: name, components: components, edges: edges]
                }
            }
            def out = root.file('.work/evidence/dependency-inventory/resolved-dependencies.json')
            out.parentFile.mkdirs()
            out.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                schemaVersion: 1, sourceCommit: sha, gradleVersion: gradle.gradleVersion,
                scope: 'selected-app-runtime-graphs', unresolvedCount: failures, graphs: reports
            ])) + '\n'
            if (failures != 0) throw new GradleException("Unresolved dependencies: ${failures}")
        }
    }
}
