// Diagnostic-only. Separate build classpaths from application runtime.
import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

gradle.projectsEvaluated {
    def root = gradle.rootProject
    def plans
    def outputRoot
    if (root.name == 'MuxTV') {
        outputRoot = root.projectDir
        plans = [
            [project: root, file: 'main-root', build: 'main', configs: ['buildscript:classpath']],
            [project: root.project(':app:tv'), file: 'main-tv', build: 'main', configs: ['buildscript:classpath'], processors: true],
            [project: root.project(':core:database'), file: 'main-database', build: 'main', configs: [], processors: true],
            [project: root.project(':benchmark:jvm'), file: 'main-jvm-benchmark', build: 'main', configs: ['jmhRuntimeClasspath']]
        ]
    } else if (root.name == 'build-logic') {
        outputRoot = root.projectDir.parentFile
        plans = [
            [project: root.project(':convention'), file: 'build-logic-convention',
             build: 'build-logic', configs: ['runtimeClasspath', 'testRuntimeClasspath']]
        ]
    } else {
        return
    }
    plans.each { plan ->
        def owner = plan.project
        def output = new File(outputRoot, ".work/evidence/dependency-inventory/build-${plan.file}.json")
        def version = gradle.gradleVersion
        owner.tasks.register('muxtvBuildDependencyInventory') {
            doLast {
                def sha = System.getenv('SOURCE_COMMIT')
                if (!(sha ==~ /[0-9a-f]{40}/)) throw new GradleException('Missing SOURCE_COMMIT')
                int failures = 0
                def discovered = []
                if (plan.processors) {
                    discovered = owner.configurations.findAll {
                        it.name.startsWith('ksp') && it.name.endsWith('ProcessorClasspath') && it.canBeResolved
                    }.collect { it.name }.sort()
                    if (discovered.isEmpty()) {
                        throw new GradleException("No resolvable KSP processor classpaths in ${owner.path}")
                    }
                }
                def graphs = (plan.configs + discovered).collect { name ->
                    def config = name == 'buildscript:classpath' ?
                        owner.buildscript.configurations.findByName('classpath') :
                        owner.configurations.findByName(name)
                    if (config == null || !config.canBeResolved) {
                        throw new GradleException("Missing resolvable build configuration: ${owner.path}:${name}")
                    }
                    def result = config.incoming.resolutionResult
                    def components = result.allComponents.collect { component ->
                        def id = component.id
                        id instanceof ModuleComponentIdentifier ?
                            [kind: 'module', id: id.displayName, group: id.group, name: id.module, version: id.version] :
                            [kind: 'other', id: id.displayName]
                    }.sort { it.id }
                    def edges = result.allDependencies.collect { dependency ->
                        def entry = [from: dependency.from.id.displayName, requested: dependency.requested.displayName]
                        if (dependency instanceof ResolvedDependencyResult) {
                            entry.selected = dependency.selected.id.displayName
                            entry.constraint = dependency.constraint
                        } else if (dependency instanceof UnresolvedDependencyResult) {
                            entry.unresolved = true
                            failures++
                        } else {
                            throw new GradleException('Unknown build dependency result')
                        }
                        entry
                    }.sort { a, b -> (a.from <=> b.from) ?: (a.requested <=> b.requested) ?:
                        ((a.selected ?: '') <=> (b.selected ?: '')) }
                    [build: plan.build, project: owner.path, configuration: name,
                     rootComponent: result.rootComponent.get().id.displayName,
                     components: components, edges: edges]
                }
                output.parentFile.mkdirs()
                output.setText(JsonOutput.prettyPrint(JsonOutput.toJson([
                    schemaVersion: 1, sourceCommit: sha, gradleVersion: version,
                    scope: 'selected-build-graphs', unresolvedCount: failures,
                    discoveredProcessorConfigurations: discovered, graphs: graphs
                ])) + '\n', 'UTF-8')
                if (failures != 0) throw new GradleException("Unresolved build dependencies: ${failures}")
            }
        }
    }
}
