schema_version: 2
modules:
  app-tv:
    type: android_application
    owns: [composition_root, tv_navigation, app_lifecycle, package_update_entrypoints, platform_capabilities]
    depends_on: [feature_modules, player_media3, catalog_adapters, epg_adapters, local_control_server, core_modules]
  core-common:
    type: pure_kotlin_library
    kmp_compatible: true
    owns: [result, errors, typed_ids, clock_contract, correlation_ids]
    android_dependencies: forbidden
  core-model:
    type: pure_kotlin_library
    kmp_compatible: true
    owns: [domain_models, profile_models, catalog_models, contract_dto]
    android_dependencies: forbidden
  core-database:
    type: android_library
    owns: [room_database, schema_export, dao, migrations, staging_transactions, revision_commit]
    direct_feature_access: forbidden
    future_kmp_requires_adr: true
  core-network:
    type: android_library
    owns: [okhttp_clients, source_network_policy, credential_application, downloads, redirect_validation, redaction]
  core-designsystem:
    type: android_library
    owns: [semantic_tokens, focus_components, tv_theme, accessibility_variants, component_catalog]
  core-ui:
    type: android_library
    owns: [generic_tv_layout_primitives, focus_bookmark_support, common_state_views]
  core-testing:
    type: kotlin_android_test_support
    owns: [fakes, fixtures, corpus_generators, architecture_test_dsl, redaction_canaries]
  catalog-api:
    type: pure_kotlin_library
    kmp_compatible: true
    owns: [source_ports, catalog_ports, revision_contracts, mutation_contracts]
  catalog-m3u:
    type: pure_kotlin_library
    kmp_candidate: true
    owns: [m3u_parser, directive_ast, parser_warnings, source_adapter]
  catalog-normalization:
    type: pure_kotlin_library
    kmp_candidate: true
    owns: [aliases, normalized_features, blocking, duplicate_candidates]
  catalog-matching:
    type: pure_kotlin_library
    kmp_candidate: true
    owns: [smart_channel_scoring, conflict_rules, proposals, calibration_contracts]
  epg-api:
    type: pure_kotlin_library
    kmp_compatible: true
    owns: [epg_ports, epg_models, binding_contracts]
  epg-xmltv:
    type: pure_kotlin_library
    kmp_candidate: true
    owns: [secure_streaming_xmltv_parser, time_normalization, warnings]
  epg-matching:
    type: pure_kotlin_library
    kmp_candidate: true
    owns: [epg_candidate_generation, match_scoring, binding_proposals]
  player-api:
    type: pure_kotlin_library
    owns: [playback_contracts, stable_errors, recovery_contracts, diagnostic_models]
    media3_dependency: forbidden
  player-media3:
    type: android_library
    owns: [media3_adapter, media_session, audio_focus, surface_lifecycle, device_capabilities, engine_error_mapping]
  player-fake:
    type: kotlin_test_library
    owns: [deterministic_engine, fault_injection, playback_clock]
  doctor-api:
    type: pure_kotlin_library
    owns: [probe_models, findings, scoring_contracts, mutation_preview]
  doctor-runtime:
    type: android_library
    owns: [probe_scheduler, media3_sample_probe, network_probe, observed_health_aggregation]
  local-control-server:
    type: android_library
    owns: [embedded_ktor_server, pairing, sessions, capability_middleware, local_api]
  local-control-web:
    type: bundled_static_web_assets
    owns: [phone_setup_ui]
    external_runtime_dependencies: forbidden
  feature-modules:
    type: android_feature_group
    children: [onboarding, home, live, guide, search, sources, doctor, profiles, settings]
    access_rules: [use_application_ports, no_dao, no_media3, no_raw_okhttp]
  benchmark:
    type: android_test
    owns: [macrobenchmarks, performance_corpus, report_generation]
  baseline-profile:
    type: android_test
    owns: [critical_user_journeys, baseline_profile_generation]
  build-logic:
    type: gradle_included_build
    owns: [convention_plugins, dependency_rules, quality_task_wiring]
rules:
  - domain_and_pure_kotlin_modules_must_not_depend_on_android
  - features_must_not_access_dao_or_network_clients_directly
  - features_and_player_api_must_not_import_media3
  - adapters_depend_on_ports_not_other_adapter_implementations
  - database_is_android_first_until_new_adr
  - actual_kmp_conversion_requires_real_second_target
  - cyclic_dependencies_forbidden
  - new_module_requires_independent_boundary_or_measured_build_dependency_value
  - no_arbitrary_extension_code_in_main_process
last_reviewed: 2026-07-19
