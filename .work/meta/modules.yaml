schema_version: 2
state: implementation_current
last_reviewed: 2026-07-25
actual_modules:
  app-tv:
    gradle_path: :app:tv
    type: android_application
    owns: [composition_root, navigation3_routes, tv_activity, hilt_wiring, android_manifest]
  core-common:
    gradle_path: :core:common
    type: pure_kotlin_library
    owns: [result_contracts, common_errors, typed_ids]
  core-model:
    gradle_path: :core:model
    type: pure_kotlin_library
    owns: [shared_domain_models]
  core-database:
    gradle_path: :core:database
    type: android_library
    owns: [room_schema_v4, migrations, dao, revisions, staging, activation, playback_catalog, source_refresh_store]
  core-designsystem:
    gradle_path: :core:designsystem
    type: android_compose_library
    owns: [tv_theme, tokens, focus_surfaces, action_components]
  core-ui:
    gradle_path: :core:ui
    type: android_compose_library
    owns: [shared_tv_ui_primitives]
  core-testing:
    gradle_path: :core:testing
    type: test_support_library
    owns: [shared_test_support]
  core-network:
    gradle_path: :core:network
    type: android_library
    owns: [okhttp_resources, source_url_policy, redirects, sensitive_header_policy, response_limits, redaction]
  core-credentials:
    gradle_path: :core:credentials
    type: android_library
    owns: [android_keystore_keys, encrypted_credential_store, credential_envelopes]
  catalog-api:
    gradle_path: :catalog:api
    type: pure_kotlin_library
    owns: [catalog_ports, playback_catalog_contracts]
  catalog-ingest:
    gradle_path: :catalog:ingest
    type: pure_kotlin_library
    owns: [bounded_streaming_m3u_parser, parser_models, warnings]
  catalog-importer:
    gradle_path: :catalog:importer
    type: pure_kotlin_library
    owns: [revision_import_pipeline, staging_batches]
  catalog-refresh:
    gradle_path: :catalog:refresh
    type: android_library
    owns: [remote_source_access, secure_fetch, prepare_activate_cancel, refresh_results]
  catalog-sync:
    gradle_path: :catalog:sync
    type: android_library
    owns: [workmanager_refresh, refresh_scheduler, leases]
  catalog-onboarding:
    gradle_path: :catalog:onboarding
    type: android_library
    owns: [durable_pending_preparation_registry, startup_cleanup]
  player-api:
    gradle_path: :player:api
    type: pure_kotlin_library
    owns: [playback_requests, stable_playback_models, engine_contracts]
    media3_dependency: forbidden
  player-media3:
    gradle_path: :player:media3
    type: android_library
    owns: [media3_engine_adapter, playback_service, media_session, controller_connector, session_request_boundary]
  player-fake:
    gradle_path: :player:fake
    type: test_library
    owns: [deterministic_playback_fake]
  feature-home:
    gradle_path: :feature:home
    type: android_compose_library
    owns: [home_tv_route]
  feature-channels:
    gradle_path: :feature:channels
    type: android_compose_library
    owns: [channel_browser, focus_anchor_policy, list_focus_restoration]
  feature-player:
    gradle_path: :feature:player
    type: android_compose_library
    owns: [player_route, surface, controls, player_state_ui]
  feature-sources:
    gradle_path: :feature:sources
    type: android_compose_library
    owns: [sources_management, source_entry_wizard, source_entry_state_machine]
  build-logic:
    path: build-logic
    type: gradle_included_build
    owns: [convention_plugins, module_defaults, quality_wiring]
planned_not_created:
  - epg_api
  - epg_xmltv
  - epg_matching
  - doctor_api
  - doctor_runtime
  - local_control_server
  - local_control_web
  - feature_guide
  - feature_search
  - feature_doctor
  - feature_profiles
  - feature_settings
  - benchmark
  - baseline_profile
rules:
  - pure_kotlin_modules_must_not_depend_on_android
  - features_must_not_access_room_dao_or_raw_network_clients
  - feature_and_player_api_modules_must_not_import_media3
  - adapters_depend_on_ports_not_other_adapter_implementations
  - database_is_android_first_until_new_adr
  - actual_kmp_conversion_requires_real_second_target
  - cyclic_dependencies_forbidden
  - new_module_requires_independent_boundary_or_measured_build_dependency_value
  - no_arbitrary_extension_code_in_main_process
  - planned_modules_must_not_be_reported_as_implemented
