name: TV UI characterization device

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tv-ui-characterization-device.yml'
      - '.github/workflows/tv-ui-characterization-static.yml'
      - 'tools/ui-characterization/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-ui-characterization-device-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  characterize:
    name: TV UI characterization API36
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MUXTV_EXPECTED_AVD: MuxTV_TV_CURRENT_API36
      MUXTV_UI_EVIDENCE: .work/evidence/ui-characterization
      MUXTV_KVM_EVIDENCE: .work/evidence/ui-characterization/kvm

    steps:
      - name: Checkout exact source with immutable comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$EXPECTED_HEAD" ]] || { echo "U0 checkout mismatch: expected $EXPECTED_HEAD, got $actual" >&2; exit 1; }

      - name: Set up MuxTV JDK toolchains
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Set up persistent Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: enhanced
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          cache-cleanup: on-success

      - name: Verify hosted U0 execution contract
        shell: pwsh
        run: .\tools\ui-characterization\Test-TvUiHostedExecutionContract.ps1

      - name: Verify immutable A B C source facts
        shell: pwsh
        run: .\tools\ui-characterization\Test-TvUiSourceFacts.ps1

      - name: Enable KVM for Android Emulator
        shell: bash
        run: bash ./tools/ci/Enable-HostedAndroidKvm.sh

      - name: Run immutable A B C UI characterization on API36
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2, 2026-07-05
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          avd-name: MuxTV_TV_CURRENT_API36
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -camera-back none -camera-front none -netdelay none -netspeed full
          script: bash ./tools/ui-characterization/Run-HostedTvUiCharacterization.sh

      - name: Analyze A B C geometry and focus evidence
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MUXTV_UI_RUN_ROOT)) {
            throw 'Hosted U0 did not publish MUXTV_UI_RUN_ROOT.'
          }
          & .\tools\ui-characterization\Analyze-TvUiCharacterization.ps1 -RunRoot $env:MUXTV_UI_RUN_ROOT

      - name: Upload U0 characterization evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: tv-ui-characterization-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/ui-characterization/**
          retention-days: 7
          github-token: ${{ github.token }}
