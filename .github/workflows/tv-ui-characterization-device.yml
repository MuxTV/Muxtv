name: TV UI characterization device

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/ui-characterization/run.request'

permissions:
  contents: read
  actions: read

concurrency:
  group: tv-ui-characterization-device-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  admission:
    name: Admit trigger-only UI characterization request
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      allowed: ${{ steps.classify.outputs.allowed }}
      reason: ${{ steps.classify.outputs.reason }}
      trigger_head: ${{ steps.classify.outputs.trigger_head }}
      parent_head: ${{ steps.classify.outputs.parent_head }}
      validated_parent: ${{ steps.classify.outputs.validated_parent }}

    steps:
      - name: Checkout exact PR head for hosted admission
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact source head
        shell: pwsh
        run: |
          $actual = (& git rev-parse HEAD).Trim()
          $expected = '${{ github.event.pull_request.head.sha }}'
          if ($LASTEXITCODE -ne 0 -or $actual -cne $expected) {
            throw "UI characterization admission checkout mismatch: expected $expected, got $actual"
          }

      - name: Classify trigger-only marker
        id: classify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\tools\ui-characterization\UiCharacterizationDeviceAdmission.ps1

          $markerPath = '.github/ui-characterization/run.request'
          $markerContent = if (Test-Path -LiteralPath $markerPath -PathType Leaf) {
            Get-Content -LiteralPath $markerPath -Raw
          } else {
            ''
          }

          $triggerHead = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve UI characterization trigger head.' }
          $parentHead = (& git rev-parse HEAD^).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve UI characterization trigger parent.' }
          $changed = @(& git diff --name-only $parentHead $triggerHead)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect trigger commit diff during hosted admission.' }

          $decision = Resolve-TvUiDeviceAdmissionState `
            -TriggerHead $triggerHead `
            -ParentHead $parentHead `
            -MarkerContent $markerContent `
            -ChangedPaths $changed `
            -MarkerPath $markerPath

          "allowed=$($decision.Allowed.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "reason=$($decision.Reason)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "trigger_head=$($decision.TriggerHead)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "parent_head=$($decision.ParentHead)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "validated_parent=$($decision.ValidatedCompiledParent)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if ($env:GITHUB_STEP_SUMMARY) {
            @(
              '### UI characterization hosted admission'
              ''
              "- allowed: ``$($decision.Allowed.ToString().ToLowerInvariant())``"
              "- reason: ``$($decision.Reason)``"
              "- trigger: ``$($decision.TriggerHead)``"
              "- parent: ``$($decision.ParentHead)``"
              "- marker validates: ``$($decision.ValidatedCompiledParent)``"
            ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }

          Write-Host "Hosted UI characterization admission: allowed=$($decision.Allowed) reason=$($decision.Reason)"

  characterize:
    name: Characterize A B C on canonical API36
    needs: admission
    if: ${{ needs.admission.outputs.allowed == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Windows, X64, muxtv-android, muxtv-device]
    timeout-minutes: 240

    steps:
      - name: Checkout exact PR head with comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Clean workspace with Windows long paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --local core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Failed to enable Git long paths.' }
          git reset --hard HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Failed to reset workspace.' }
          $cleanOutput = (& git clean -ffdx 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Failed to clean workspace.`n$cleanOutput" }
          $dirty = (& git status --porcelain=v1 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw "Workspace remains dirty after reset/clean.`n$dirty" }

      - name: Verify exact source head
        shell: pwsh
        run: |
          $expected = '${{ github.event.pull_request.head.sha }}'
          & .\tools\ci\Assert-EvidenceCommit.ps1 -ExpectedCommit $expected

      - name: Re-verify trigger-only marker against compiled parent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\tools\ui-characterization\UiCharacterizationDeviceAdmission.ps1

          $markerPath = '.github/ui-characterization/run.request'
          $markerContent = if (Test-Path -LiteralPath $markerPath -PathType Leaf) {
            Get-Content -LiteralPath $markerPath -Raw
          } else {
            ''
          }

          $triggerHead = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve UI characterization trigger head.' }
          $parentHead = (& git rev-parse HEAD^).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve UI characterization trigger parent.' }
          $changed = @(& git diff --name-only $parentHead $triggerHead)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect trigger-only marker diff.' }

          $decision = Resolve-TvUiDeviceAdmissionState `
            -TriggerHead $triggerHead `
            -ParentHead $parentHead `
            -MarkerContent $markerContent `
            -ChangedPaths $changed `
            -MarkerPath $markerPath

          if (-not $decision.Allowed) {
            throw "Hosted-admitted UI characterization trigger failed device-side re-verification: $($decision.Reason)"
          }
          if ($decision.TriggerHead -cne '${{ needs.admission.outputs.trigger_head }}' -or
              $decision.ParentHead -cne '${{ needs.admission.outputs.parent_head }}' -or
              $decision.ValidatedCompiledParent -cne '${{ needs.admission.outputs.validated_parent }}') {
            throw 'Device-side UI characterization admission provenance differs from hosted admission outputs.'
          }

          $evidenceDirectory = '.work\evidence\ui-characterization-runner'
          New-Item -ItemType Directory -Force -Path $evidenceDirectory | Out-Null
          [ordered]@{
            schemaVersion = 2
            triggerHead = $decision.TriggerHead
            parentHead = $decision.ParentHead
            validatedCompiledParent = $decision.ValidatedCompiledParent
            markerPath = $decision.MarkerPath
            triggerOnly = $true
            hostedAdmissionReason = '${{ needs.admission.outputs.reason }}'
          } | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath (Join-Path $evidenceDirectory 'admission.json') -Encoding utf8

      - name: Preflight dedicated Android TV runner
        shell: pwsh
        run: |
          & .\tools\ci\Assert-SelfHostedRunnerPreflight.ps1 `
            -RequireNoConnectedDevice `
            -ExpectedRunnerLabels muxtv-android,muxtv-device `
            -ExpectedSystemImageApis 26,36

      - name: Initialize SDK and validate characterization harness
        shell: pwsh
        run: |
          . .\tools\android\Initialize-AndroidSdkEnvironment.ps1 -PersistForGitHubActions
          & .\tools\android\Test-TvHarnessSyntax.ps1
          & .\tools\ui-characterization\Test-TvUiCharacterizationHarness.ps1
          & .\tools\ui-characterization\Test-TvUiStartupRecovery.ps1
          & .\tools\ui-characterization\Test-TvUiDeviceAdmission.ps1

      - name: Collect immutable A B C UI source facts
        shell: pwsh
        run: |
          & .\tools\ui-characterization\Collect-TvUiSourceFacts.ps1 `
            -OutputPath '.work\evidence\ui-characterization\source-facts.json'

      - name: Run immutable A B C characterization
        shell: pwsh
        env:
          MUXTV_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          . .\tools\ui-characterization\UiCharacterizationStartupRecovery.ps1

          $evidenceRoot = '.work\evidence\ui-characterization'
          $runnerEvidence = '.work\evidence\ui-characterization-runner'
          $completed = $false
          $maxAttempts = 2

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              & .\tools\ui-characterization\Invoke-TvUiCharacterization.ps1 -NoDaemon
              $completed = $true
              break
            } catch {
              $failureMessage = $_.Exception.Message
              $recoverable = $attempt -lt $maxAttempts -and (
                Test-TvUiRecoverableEmulatorStartupFailure `
                  -EvidenceRoot $evidenceRoot `
                  -FailureMessage $failureMessage
              )

              if (-not $recoverable) {
                throw
              }

              New-Item -ItemType Directory -Force -Path $runnerEvidence | Out-Null
              [ordered]@{
                schemaVersion = 1
                firstAttemptFailure = $failureMessage
                classification = 'android-emulator-modem-transport-startup'
                retryAttempt = $attempt + 1
                maxAttempts = $maxAttempts
                avdName = 'MuxTV_TV_CURRENT_API36'
                createsAdditionalAvdIdentity = $false
              } | ConvertTo-Json -Depth 3 |
                Set-Content -LiteralPath (Join-Path $runnerEvidence 'startup-recovery.json') -Encoding utf8

              Write-Warning "Recoverable Android Emulator modem transport startup failure detected. Retrying characterization once on the same canonical API36 AVD identity."
              Start-Sleep -Seconds 3
            }
          }

          if (-not $completed) {
            throw 'UI characterization did not complete within the bounded startup recovery contract.'
          }

      - name: Analyze A B C geometry and focus evidence
        shell: pwsh
        run: |
          & .\tools\ui-characterization\Analyze-TvUiCharacterization.ps1

      - name: Record repository AVD inventory
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceDirectory = '.work\evidence\ui-characterization-runner'
          New-Item -ItemType Directory -Force -Path $evidenceDirectory | Out-Null

          . .\tools\android\Initialize-AndroidSdkEnvironment.ps1
          . .\tools\android\AndroidSdk.ps1
          $tools = Get-AndroidSdkTools
          $inventory = @(& $tools.AvdManager list avd -c 2>&1)
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to enumerate Android Virtual Devices after UI characterization.'
          }
          $inventory | Set-Content -LiteralPath (Join-Path $evidenceDirectory 'avd-inventory.txt') -Encoding utf8

          & .\tools\android\Remove-LegacyMuxTvAvds.ps1 *>&1 |
            Tee-Object -FilePath (Join-Path $evidenceDirectory 'legacy-muxtv-avds-dry-run.txt')

      - name: Upload UI characterization evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: tv-ui-characterization-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/ui-characterization/**
            .work/evidence/ui-characterization-runner/**
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          retention-days: 14
          github-token: ${{ github.token }}

      - name: Reset Android runner state
        if: always()
        shell: pwsh
        run: |
          & .\tools\ci\Reset-SelfHostedAndroidState.ps1
