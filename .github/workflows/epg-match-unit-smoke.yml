name: EPG match unit smoke

on:
  push:
    branches:
      - fix/epg-matching-now-next-71

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run EPG match unit contracts
        run: ./gradlew :core:database:testDebugUnitTest --tests 'app.muxtv.database.EpgMatch*' --no-daemon --stacktrace --console=plain
