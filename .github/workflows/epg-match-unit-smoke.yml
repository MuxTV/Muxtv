name: EPG match unit smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run EPG matching contracts
        run: ./gradlew :core:database:testDebugUnitTest --tests 'app.muxtv.database.EpgMatch*' :core:database:compileDebugAndroidTestKotlin --no-daemon --stacktrace --console=plain
      - name: Upload generated Room schema
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: epg-match-room-schema-${{ github.run_id }}
          path: .work/evidence/room-schemas/**/*.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 1
