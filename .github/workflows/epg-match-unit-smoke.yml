name: EPG match unit smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run EPG matching contracts
        run: ./gradlew :catalog:api:test :catalog:sync:test :core:database:testDebugUnitTest --tests 'app.muxtv.database.EpgMatch*' :core:database:compileDebugAndroidTestKotlin --no-daemon --stacktrace --console=plain
      - name: Upload generated Room schema
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: epg-match-room-schema-${{ github.run_id }}
          path: .work/evidence/room-schemas/**/*.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 1
      - name: Commit generated Room v7 schema
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          schema='core/database/schemas/app.muxtv.database.MuxTvDatabase/7.json'
          test -f "$schema"
          if [[ -z "$(git status --porcelain -- "$schema")" ]]; then
            echo 'Room v7 schema is already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$schema"
          git commit -m 'chore: commit Room schema v7'
          git push origin HEAD:${{ github.head_ref }}
