name: Local Control Android crypto provider compatibility

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/local-control-android-crypto-compat.yml'
      - 'local-control/crypto-android-compat/**'
      - 'local-control/crypto-lab/**'
      - 'local-control/tv-qr/**'
      - 'tools/local-control/Run-AndroidCryptoProviderTests.sh'
      - '.work/research/lc04-s2-android-provider-20261015.md'
      - 'settings.gradle.kts'
      - 'gradle/libs.versions.toml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lc04-android-crypto-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  device:
    name: Crypto Android API${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            arch: x86
            avd: MuxTV_TV_OLD_API26
            ram: 1536M
          - api: 36
            arch: x86_64
            avd: MuxTV_TV_CURRENT_API36
            ram: 2048M

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up pinned MuxTV JDKs
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Verify immutable source commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Enable KVM
        shell: bash
        env:
          MUXTV_KVM_EVIDENCE: .work/evidence/crypto-android/api-${{ matrix.api }}
        run: bash ./tools/ci/Enable-HostedAndroidKvm.sh

      - name: Install hosted Android ADB retry shim
        shell: bash
        run: bash ./tools/ci/Install-HostedAdbRetryShim.sh

      - name: Exercise HPKE, Ed25519 and TV QR preview on Android API${{ matrix.api }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2, 2026-07-05
        env:
          MUXTV_EXPECTED_AVD: ${{ matrix.avd }}
          MUXTV_CRYPTO_EVIDENCE: .work/evidence/crypto-android/api-${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          avd-name: ${{ matrix.avd }}
          target: android-tv
          profile: tv_1080p
          force-avd-creation: true
          cores: 2
          ram-size: ${{ matrix.ram }}
          heap-size: 256M
          disk-size: 4G
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect
          script: bash ./tools/local-control/Run-AndroidCryptoProviderTests.sh

      - name: Upload scoped Android crypto compatibility evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: lc04-android-crypto-api${{ matrix.api }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/crypto-android/api-${{ matrix.api }}/**
            local-control/crypto-android-compat/build/outputs/androidTest-results/**
          retention-days: 7
          github-token: ${{ github.token }}

  gate:
    name: Local Control Android crypto provider matrix
    runs-on: ubuntu-latest
    if: always()
    needs: device
    timeout-minutes: 5
    steps:
      - name: Require passing API26 and API36 instrumentation
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.device.result }}
        run: |
          set -euo pipefail
          test "$MATRIX_RESULT" = success
          echo "Android device cryptography and public TV QR generation passed. Protected network channel remains unimplemented."
