name: Self-hosted validation

on:
  workflow_dispatch:
    inputs:
      validation_mode:
        description: Validation depth
        required: true
        default: Fast
        type: choice
        options:
          - Fast
          - Full
          - DeviceCurrent
          - DeviceMatrix
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: self-hosted-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ github.event_name == 'pull_request' && 'Full validation' || 'Manual validation' }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180

    steps:
      - name: Checkout without pre-clean
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: false

      - name: Clean workspace with Windows long paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.longpaths true
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to enable repository-local Git long-path support."
          }

          git reset --hard HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to reset the checked-out workspace."
          }

          $cleanOutput = (& git clean -ffdx 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clean the checked-out workspace.`n$cleanOutput"
          }

          $dirty = (& git status --porcelain=v1 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to inspect the checked-out workspace.`n$dirty"
          }
          if ($dirty) {
            throw "Workspace remains dirty after explicit reset/clean.`n$dirty"
          }

          $evidenceDirectory = ".work\evidence\workspace-cleanup"
          New-Item -ItemType Directory -Force -Path $evidenceDirectory | Out-Null
          @(
            "git_version=$(git --version)"
            "core_longpaths=$(git config --local --get core.longpaths)"
            "workspace_clean=true"
            "clean_output=$cleanOutput"
          ) | Set-Content -Path (Join-Path $evidenceDirectory "workspace-cleanup.log") -Encoding utf8

      - name: Inspect runner environment
        shell: pwsh
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Architecture: $env:RUNNER_ARCH"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          java -version
          if ($env:ANDROID_SDK_ROOT) {
            Write-Host "ANDROID_SDK_ROOT is configured."
          } elseif ($env:ANDROID_HOME) {
            Write-Host "ANDROID_HOME is configured."
          } else {
            throw "ANDROID_SDK_ROOT or ANDROID_HOME must be configured on the self-hosted runner."
          }

      - name: Validate Android TV harness syntax
        shell: pwsh
        run: |
          $diagnosticDirectory = ".work\evidence\harness-syntax"
          $diagnosticPath = Join-Path $diagnosticDirectory "harness-syntax.log"
          New-Item -ItemType Directory -Force -Path $diagnosticDirectory | Out-Null

          try {
            & .\tools\android\Test-TvHarnessSyntax.ps1
          } catch {
            $details = $_ | Out-String
            if (-not (Test-Path $diagnosticPath -PathType Leaf)) {
              Set-Content -Path $diagnosticPath -Value $details -Encoding utf8
            }
            Write-Host "Android TV harness validation failed:"
            Get-Content $diagnosticPath
            throw
          }

      - name: Select validation mode
        id: validation
        shell: pwsh
        run: |
          $mode = "Full"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $mode = "${{ inputs.validation_mode }}"
          }
          "mode=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Validation mode: $mode"

      - name: Run MuxTV validation
        shell: pwsh
        run: |
          $mode = "${{ steps.validation.outputs.mode }}"
          $branch = "${{ github.head_ref || github.ref_name }}"
          $commit = "${{ github.event.pull_request.head.sha || github.sha }}"

          if ($mode -in @("DeviceCurrent", "DeviceMatrix")) {
            pwsh -NoProfile -File .\tools\android\Invoke-TvDeviceValidation.ps1 `
              -Mode $mode `
              -SourceBranch $branch `
              -SourceCommit $commit `
              -NoDaemon
          } else {
            pwsh -NoProfile -File .\tools\verify-local.ps1 `
              -Mode $mode `
              -SourceBranch $branch `
              -SourceCommit $commit `
              -NoDaemon
          }

      - name: Generate small synthetic corpus evidence
        if: success() && steps.validation.outputs.mode == 'Full'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          $commit = "${{ github.event.pull_request.head.sha || github.sha }}"
          $evidenceDirectory = ".work\evidence\corpus-generation"
          $logPath = Join-Path $evidenceDirectory "corpus-generation.log"
          New-Item -ItemType Directory -Force -Path $evidenceDirectory | Out-Null

          $output = & .\gradlew.bat `
            :core:testing:generateM3uCorpus `
            --no-daemon `
            --stacktrace `
            --console=plain `
            "-PcorpusProfile=small-1k" `
            "-PcorpusSeed=20260728" `
            "-PcorpusSourceCommit=$commit" `
            "-PcorpusOverwrite=true" 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $logPath | ForEach-Object { Write-Host $_ }

          if ($exitCode -ne 0) {
            throw "Synthetic corpus generation failed with exit code $exitCode."
          }

      - name: Measure small synthetic M3U parse
        if: success() && steps.validation.outputs.mode == 'Full'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          $commit = "${{ github.event.pull_request.head.sha || github.sha }}"
          $evidenceDirectory = ".work\evidence\m3u-parse-measurement"
          $logPath = Join-Path $evidenceDirectory "m3u-parse-measurement.log"
          New-Item -ItemType Directory -Force -Path $evidenceDirectory | Out-Null

          $output = & .\gradlew.bat `
            :core:testing:measureM3uParse `
            --no-daemon `
            --stacktrace `
            --console=plain `
            "-PmeasurementProfile=small-1k" `
            "-PmeasurementSeed=20260728" `
            "-PmeasurementSourceCommit=$commit" `
            "-PmeasurementWarmups=2" `
            "-PmeasurementIterations=5" `
            "-PmeasurementRunnerLabel=self-hosted-windows-x64" 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $logPath | ForEach-Object { Write-Host $_ }

          if ($exitCode -ne 0) {
            throw "Descriptive M3U parse measurement failed with exit code $exitCode."
          }

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: self-hosted-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/**/*.json
            .work/evidence/**/*.log
            .work/evidence/**/*.txt
            .work/evidence/**/*.png
            core/testing/build/corpus/*.m3u8
            core/testing/build/corpus/*.manifest.json
            core/testing/build/measurements/*.json
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
