name: Hosted validation

on:
  workflow_dispatch:
    inputs:
      validation_mode:
        description: Host validation depth
        required: true
        default: Full
        type: choice
        options:
          - Fast
          - Full
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hosted-validation-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    # Preserve this historical PR check name because branch-protection settings
    # are not readable by the repository integration. Public-repository compute
    # is now GitHub-hosted, so ordinary PRs run the actual Full host suite.
    name: ${{ github.event_name == 'pull_request' && 'Full validation' || 'Manual validation' }}
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Normalize workspace and enable Windows long paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw "Failed to enable repository-local Git long-path support." }
          git reset --hard HEAD
          if ($LASTEXITCODE -ne 0) { throw "Failed to reset the checked-out workspace." }
          $cleanOutput = (& git clean -ffdx 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Failed to clean the checked-out workspace.`n$cleanOutput" }
          $dirty = (& git status --porcelain=v1 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Failed to inspect the checked-out workspace.`n$dirty" }
          if ($dirty) { throw "Workspace remains dirty after explicit reset/clean.`n$dirty" }

          $evidenceDirectory = ".work\evidence\workspace-cleanup"
          New-Item -ItemType Directory -Force -Path $evidenceDirectory | Out-Null
          @(
            "runner_environment=github-hosted"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "git_version=$(git --version)"
            "core_longpaths=$(git config --local --get core.longpaths)"
            "workspace_clean=true"
            "clean_output=$cleanOutput"
          ) | Set-Content -Path (Join-Path $evidenceDirectory "workspace-cleanup.log") -Encoding utf8

      - name: Verify evidence commit provenance
        shell: pwsh
        run: |
          $expectedCommit = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          & .\tools\ci\Assert-EvidenceCommit.ps1 -ExpectedCommit $expectedCommit

      - name: Validate risk-based CI contract
        shell: pwsh
        run: |
          & .\tools\ci\Test-RiskBasedDeviceLaneContract.ps1

      - name: Inspect hosted build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Architecture: $env:RUNNER_ARCH"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          java -version
          if ($LASTEXITCODE -ne 0) { throw "Java runtime inspection failed." }
          . .\tools\android\Initialize-AndroidSdkEnvironment.ps1 -PersistForGitHubActions
          . .\tools\android\AndroidSdk.ps1
          $tools = Get-AndroidSdkTools -AllowMissingRuntime
          Write-Host "Android SDK root: $($tools.Root)"
          Write-Host "sdkmanager=$([System.IO.Path]::GetFileName($tools.SdkManager))"
          Write-Host "avdmanager=$([System.IO.Path]::GetFileName($tools.AvdManager))"

      - name: Select validation mode
        id: validation
        shell: pwsh
        run: |
          $mode = "Full"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $mode = "${{ inputs.validation_mode }}"
          }
          "mode=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Host validation mode: $mode"

      - name: Run MuxTV host validation
        shell: pwsh
        env:
          MUXTV_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          MUXTV_SOURCE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          pwsh -NoProfile -File .\tools\verify-local.ps1 `
            -Mode "${{ steps.validation.outputs.mode }}" `
            -SourceBranch $env:MUXTV_SOURCE_BRANCH `
            -SourceCommit $env:MUXTV_SOURCE_COMMIT `
            -NoDaemon

      - name: Upload validation evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: hosted-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/**/*.json
            .work/evidence/**/*.log
            .work/evidence/**/*.txt
            app/tv/build/reports/lint-results-debug.*
            player/media3/build/reports/lint-results-debug.*
          retention-days: 7
          github-token: ${{ github.token }}
