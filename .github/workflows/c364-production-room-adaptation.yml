name: C364 production Room adaptation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'catalog/importer/src/main/kotlin/app/muxtv/catalog/importer/CatalogEntryIdentityFactory.kt'
      - 'catalog/importer/src/main/kotlin/app/muxtv/catalog/importer/CatalogEntryPayloadFingerprint.kt'
      - 'core/database/src/debug/kotlin/app/muxtv/database/measurement/C03Production**'
      - 'core/database/src/androidTest/kotlin/app/muxtv/database/C03Production**'
      - 'tools/ci/Test-GitHubHostedWorkflowContract.ps1'
      - '.github/workflows/c364-production-room-adaptation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c364-production-room-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  correctness-contract:
    name: C364 production Room correctness contract
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up MuxTV JDK toolchains
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Verify exact source commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Compile C364 production Room contracts
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :core:database:compileDebugAndroidTestKotlin
