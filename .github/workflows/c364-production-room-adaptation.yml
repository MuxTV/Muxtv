name: C364 production Room adaptation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'catalog/importer/src/main/kotlin/app/muxtv/catalog/importer/CatalogEntryIdentityFactory.kt'
      - 'catalog/importer/src/main/kotlin/app/muxtv/catalog/importer/CatalogEntryPayloadFingerprint.kt'
      - 'core/database/src/debug/kotlin/app/muxtv/database/measurement/C03Production**'
      - 'core/database/src/androidTest/kotlin/app/muxtv/database/C03Production**'
      - 'tools/ci/Test-GitHubHostedWorkflowContract.ps1'
      - '.github/workflows/c364-production-room-adaptation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c364-production-room-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  correctness-contract:
    name: C364 production Room correctness contract
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up MuxTV JDK toolchains
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Verify exact source commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Compile C364 production Room contracts
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :core:database:compileDebugAndroidTestKotlin

  smoke-evidence:
    name: C364 production Room API36 smoke evidence
    needs: correctness-contract
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up MuxTV JDK toolchains
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Verify exact source commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Enable KVM for Android Emulator
        shell: bash
        env:
          MUXTV_KVM_EVIDENCE: .work/evidence/c364-smoke
        run: bash ./tools/ci/Enable-HostedAndroidKvm.sh

      - name: Run C364 measurement smoke on API36
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2, 2026-07-05
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          avd-name: MuxTV_TV_CURRENT_API36
          force-avd-creation: true
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 4G
          disable-animations: true
          enable-hw-keyboard: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -camera-back none -camera-front none -netdelay none -netspeed full
          script: |
            set -euo pipefail
            ./gradlew --no-daemon --stacktrace --console=plain --no-problems-report \
              :core:database:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=app.muxtv.database.C03ProductionRoomMeasurementTest

      - name: Upload C364 smoke evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: c364-production-room-smoke-api36-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            core/database/build/outputs/androidTest-results/**
            .work/evidence/c364-smoke/**
          retention-days: 7
          github-token: ${{ github.token }}

