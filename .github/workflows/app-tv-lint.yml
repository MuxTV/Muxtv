name: App TV lint

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/app-tv-lint.yml'
      - 'app/tv/**'
      - 'core/designsystem/**'
      - 'core/ui/**'
      - 'feature/**'
      - 'player/api/**'
      - 'player/media3/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'

permissions:
  contents: read

concurrency:
  group: app-tv-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: App TV lint
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up MuxTV JDK toolchains
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Verify evidence commit provenance
        shell: pwsh
        run: |
          & .\tools\ci\Assert-EvidenceCommit.ps1 -ExpectedCommit "${{ github.event.pull_request.head.sha }}"

      - name: Initialize hosted Android SDK
        shell: pwsh
        run: |
          . .\tools\android\Initialize-AndroidSdkEnvironment.ps1 -PersistForGitHubActions

      - name: Run App TV Android lint
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\gradlew.bat :app:tv:lintDebug `
            --no-daemon `
            --console=plain `
            --stacktrace `
            --warning-mode all `
            --no-problems-report
          if ($LASTEXITCODE -ne 0) { throw "App TV lint failed with exit code $LASTEXITCODE." }

      - name: Upload lint evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: app-tv-lint-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/tv/build/reports/lint-results-debug.html
            app/tv/build/reports/lint-results-debug.txt
            app/tv/build/reports/lint-results-debug.xml
            .work/evidence/**/*.json
            .work/evidence/**/*.log
            .work/evidence/**/*.txt
          retention-days: 7
          github-token: ${{ github.token }}
