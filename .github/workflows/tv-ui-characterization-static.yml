name: TV UI characterization static

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tv-ui-characterization-static.yml'
      - '.github/workflows/tv-ui-characterization-device.yml'
      - 'tools/ui-characterization/**'

permissions:
  contents: read

concurrency:
  group: tv-ui-characterization-static-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: TV UI characterization static contract
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact PR head with comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact source head
        shell: pwsh
        run: |
          $actual = (& git rev-parse HEAD).Trim()
          $expected = '${{ github.event.pull_request.head.sha }}'
          if ($actual -cne $expected) {
            throw "UI characterization static checkout mismatch: expected $expected, got $actual"
          }

      - name: Verify hosted U0 execution contract
        shell: pwsh
        run: .\tools\ui-characterization\Test-TvUiHostedExecutionContract.ps1

      - name: Run UI characterization harness contract
        shell: pwsh
        run: .\tools\ui-characterization\Test-TvUiCharacterizationHarness.ps1

      - name: Verify route setup input characterization contract
        shell: pwsh
        run: .\tools\ui-characterization\Test-TvUiRouteSetupContract.ps1

      - name: Verify immutable A B C probe source anchors
        shell: pwsh
        run: .\tools\ui-characterization\Test-TvUiProbeAnchorCompatibility.ps1

      - name: Verify immutable A B C UI source facts
        shell: pwsh
        run: .\tools\ui-characterization\Test-TvUiSourceFacts.ps1

      - name: Run synthetic UI characterization analyzer fixture
        shell: pwsh
        run: .\tools\ui-characterization\Test-TvUiCharacterizationAnalyzer.ps1

  compile:
    name: Compile common probe (${{ matrix.id }})
    needs: contract
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: A
            commit: 2302c11441c85b8b5752d7f03cc5bc13be8c6d92
          - id: B
            commit: 515072022d11b218fcb20f43079f94098b3ea973
          - id: C
            commit: 7a45487a0c17d22cda3dd726cdee6d5d7b7f57f9

    steps:
      - name: Checkout exact PR head with comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact source head
        shell: pwsh
        run: |
          $actual = (& git rev-parse HEAD).Trim()
          $expected = '${{ github.event.pull_request.head.sha }}'
          if ($actual -cne $expected) {
            throw "UI characterization compile checkout mismatch: expected $expected, got $actual"
          }

      - name: Set up MuxTV JDK toolchains
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Initialize hosted Android SDK
        shell: pwsh
        run: . .\tools\android\Initialize-AndroidSdkEnvironment.ps1 -PersistForGitHubActions

      - name: Compile byte-identical probe on comparison ${{ matrix.id }}
        shell: pwsh
        run: |
          & .\tools\ui-characterization\Compile-TvUiCharacterizationProbe.ps1 `
            -ComparisonId '${{ matrix.id }}' `
            -Commit '${{ matrix.commit }}'