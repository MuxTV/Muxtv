name: Android TV product device matrix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/android-tv-product-device-matrix.yml
      - app/tv/src/**
      - feature/channels/**
      - feature/home/**
      - feature/guide/**
      - feature/search/**
      - feature/sources/**
      - feature/doctor/**
      - feature/settings/**
      - feature/player/**
      - player/api/**
      - player/media3/**
      - catalog/**
      - core/designsystem/**
      - core/database/**
      - core/ui/**
      - tools/android/**
      - tools/ci/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/**
      - build-logic/**

permissions:
  contents: read

concurrency:
  group: android-tv-product-device-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Android TV product device matrix
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, muxtv-android, muxtv-device]
    timeout-minutes: 180
    concurrency:
      group: muxtv-device-global
      cancel-in-progress: false

    steps:
      - name: Checkout without pre-clean
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Clean workspace with Windows long paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.longpaths true
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to enable repository-local Git long-path support."
          }

          git reset --hard HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to reset the checked-out workspace."
          }

          $cleanOutput = (& git clean -ffdx 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clean the checked-out workspace.`n$cleanOutput"
          }

          $dirty = (& git status --porcelain=v1 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to inspect the checked-out workspace.`n$dirty"
          }
          if ($dirty) {
            throw "Workspace remains dirty after explicit reset/clean.`n$dirty"
          }

      - name: Verify evidence commit provenance
        shell: pwsh
        run: |
          & .\tools\ci\Assert-EvidenceCommit.ps1 `
            -ExpectedCommit "${{ github.event.pull_request.head.sha }}"

      - name: Preflight dedicated self-hosted runner
        shell: pwsh
        run: |
          & .\tools\ci\Assert-SelfHostedRunnerPreflight.ps1 `
            -RequireNoConnectedDevice `
            -ExpectedRunnerLabels muxtv-android,muxtv-device `
            -ExpectedSystemImageApis 26,36

      - name: Inspect runner environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Architecture: $env:RUNNER_ARCH"
          java -version
          if ($LASTEXITCODE -ne 0) {
            throw "Java runtime inspection failed."
          }

          . .\tools\android\Initialize-AndroidSdkEnvironment.ps1 -PersistForGitHubActions
          . .\tools\android\AndroidSdk.ps1
          $tools = Get-AndroidSdkTools
          Write-Host "adb=$([System.IO.Path]::GetFileName($tools.Adb))"
          Write-Host "emulator=$([System.IO.Path]::GetFileName($tools.Emulator))"

      - name: Validate Android TV harness syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . .\tools\android\Initialize-AndroidSdkEnvironment.ps1
          & .\tools\android\Test-TvHarnessSyntax.ps1

      - name: Run old-edge and current Android TV product matrix
        shell: pwsh
        env:
          MUXTV_SOURCE_BRANCH: ${{ github.head_ref }}
          MUXTV_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          . .\tools\android\Initialize-AndroidSdkEnvironment.ps1
          & .\tools\android\Invoke-TvDeviceValidation.ps1 `
            -Mode DeviceMatrix `
            -SourceBranch $env:MUXTV_SOURCE_BRANCH `
            -SourceCommit $env:MUXTV_SOURCE_COMMIT `
            -NoDaemon

      - name: Upload product matrix evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-tv-product-device-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/**/*.json
            .work/evidence/**/*.log
            .work/evidence/**/*.txt
            .work/evidence/**/*.png
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

      - name: Reset Android runner state
        if: always()
        shell: pwsh
        run: |
          & .\tools\ci\Reset-SelfHostedAndroidState.ps1
