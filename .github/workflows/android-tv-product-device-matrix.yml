name: Android TV product device matrix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android-tv-product-device-matrix.yml'
      - 'tools/android/**'
      - 'tools/measurements/**'
      - 'tools/ci/Test-RiskBasedDeviceLaneContract.ps1'
      - 'tools/ci/Assert-EvidenceCommit.ps1'
      - 'tools/ci/Assert-SelfHostedRunnerPreflight.ps1'
      - 'tools/ci/Reset-SelfHostedAndroidState.ps1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-tv-product-device-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Android TV product device matrix
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, muxtv-android, muxtv-device]
    timeout-minutes: 240

    steps:
      - name: Checkout without pre-clean
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Clean workspace with Windows long paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw "Failed to enable Git long paths." }
          git reset --hard HEAD
          if ($LASTEXITCODE -ne 0) { throw "Failed to reset workspace." }
          $cleanOutput = (& git clean -ffdx 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Failed to clean workspace.`n$cleanOutput" }
          $dirty = (& git status --porcelain=v1 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw "Workspace remains dirty after reset/clean.`n$dirty" }

      - name: Verify evidence commit provenance
        shell: pwsh
        run: |
          $expected = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          & .\tools\ci\Assert-EvidenceCommit.ps1 -ExpectedCommit $expected

      - name: Preflight dedicated self-hosted runner
        shell: pwsh
        run: |
          & .\tools\ci\Assert-SelfHostedRunnerPreflight.ps1 `
            -RequireNoConnectedDevice `
            -ExpectedRunnerLabels muxtv-android,muxtv-device `
            -ExpectedSystemImageApis 26,36

      - name: Initialize Android SDK and validate harness
        shell: pwsh
        run: |
          . .\tools\android\Initialize-AndroidSdkEnvironment.ps1 -PersistForGitHubActions
          & .\tools\android\Test-TvHarnessSyntax.ps1

      - name: Run exact API26 and API36 product matrix
        shell: pwsh
        env:
          MUXTV_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          MUXTV_SOURCE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          & .\tools\android\Invoke-TvDeviceValidation.ps1 `
            -Mode DeviceMatrix `
            -SourceBranch $env:MUXTV_SOURCE_BRANCH `
            -SourceCommit $env:MUXTV_SOURCE_COMMIT `
            -NoDaemon

      - name: Record repository AVD inventory
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $evidenceDirectory = ".work\evidence\avd-inventory"
          New-Item -ItemType Directory -Force -Path $evidenceDirectory | Out-Null

          . .\tools\android\Initialize-AndroidSdkEnvironment.ps1
          . .\tools\android\AndroidSdk.ps1
          $tools = Get-AndroidSdkTools
          $avdInventory = @(& $tools.AvdManager list avd -c 2>&1)
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to enumerate Android Virtual Devices after the matrix run."
          }
          $avdInventory | Set-Content -Path (Join-Path $evidenceDirectory "avd-inventory.txt") -Encoding utf8

          & .\tools\android\Remove-LegacyMuxTvAvds.ps1 *>&1 |
            Tee-Object -FilePath (Join-Path $evidenceDirectory "legacy-muxtv-avds-dry-run.txt")

      - name: Upload product matrix evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: android-tv-product-device-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/**/*.json
            .work/evidence/**/*.log
            .work/evidence/**/*.txt
            .work/evidence/**/*.png
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          retention-days: 14
          github-token: ${{ github.token }}

      - name: Reset Android runner state
        if: always()
        shell: pwsh
        run: |
          & .\tools\ci\Reset-SelfHostedAndroidState.ps1