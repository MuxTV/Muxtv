name: Android TV product device matrix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android-tv-product-device-matrix.yml'
      - 'tools/android/**'
      - 'tools/measurements/**'
      - 'tools/ci/Test-RiskBasedDeviceLaneContract.ps1'
      - 'tools/ci/Assert-AndroidTestResults.ps1'
      - 'tools/ci/Test-AndroidTestResultsContract.ps1'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-tv-product-device-matrix-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  device:
    name: Android TV device API${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            arch: x86
            avd: MuxTV_TV_OLD_API26
            ram: 1536M
          - api: 36
            arch: x86_64
            avd: MuxTV_TV_CURRENT_API36
            ram: 2048M

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify exact source commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "Expected exact source $EXPECTED_SHA, got $actual" >&2
            exit 1
          fi

      - name: Enable KVM for Android Emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run Android TV API${{ matrix.api }} connected tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2, 2026-07-05
        env:
          MUXTV_EXPECTED_AVD: ${{ matrix.avd }}
          MUXTV_DEVICE_EVIDENCE: .work/evidence/hosted-android/api-${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: ${{ matrix.arch }}
          profile: tv_1080p
          avd-name: ${{ matrix.avd }}
          force-avd-creation: true
          cores: 2
          ram-size: ${{ matrix.ram }}
          heap-size: 256M
          disk-size: 4G
          enable-hw-keyboard: true
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none -netdelay none -netspeed full
          script: |
            set -euo pipefail
            mkdir -p "$MUXTV_DEVICE_EVIDENCE"
            avdmanager list avd -c | tee "$MUXTV_DEVICE_EVIDENCE/avd-inventory.txt"
            mapfile -t avds < <(avdmanager list avd -c | sed '/^[[:space:]]*$/d')
            if [[ "${#avds[@]}" -ne 1 || "${avds[0]}" != "$MUXTV_EXPECTED_AVD" ]]; then
              echo "Expected exactly canonical AVD $MUXTV_EXPECTED_AVD; got: ${avds[*]-<none>}" >&2
              exit 1
            fi
            chmod +x ./gradlew
            ./gradlew \
              :catalog:importer:connectedDebugAndroidTest \
              :catalog:refresh:connectedDebugAndroidTest \
              :core:credentials:connectedDebugAndroidTest \
              :core:database:connectedDebugAndroidTest \
              :player:media3:connectedDebugAndroidTest \
              :app:tv:connectedDebugAndroidTest \
              --no-daemon \
              --stacktrace \
              --console=plain \
              --no-problems-report
            pwsh -NoProfile -File ./tools/ci/Assert-AndroidTestResults.ps1 \
              -OutputPath "$MUXTV_DEVICE_EVIDENCE/android-test-results.json"

      - name: Upload API${{ matrix.api }} product evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: android-tv-api${{ matrix.api }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/hosted-android/api-${{ matrix.api }}/**
            catalog/importer/build/outputs/androidTest-results/**
            catalog/refresh/build/outputs/androidTest-results/**
            core/credentials/build/outputs/androidTest-results/**
            core/database/build/outputs/androidTest-results/**
            player/media3/build/outputs/androidTest-results/**
            app/tv/build/outputs/androidTest-results/**
          retention-days: 7
          github-token: ${{ github.token }}

  gate:
    name: Android TV product device matrix
    if: always()
    needs:
      - device
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require API26 and API36 matrix success
        shell: bash
        env:
          DEVICE_RESULT: ${{ needs.device.result }}
        run: |
          set -euo pipefail
          if [[ "$DEVICE_RESULT" != "success" ]]; then
            echo "Android TV hosted device matrix result: $DEVICE_RESULT" >&2
            exit 1
          fi
          echo "Android TV hosted device matrix passed for canonical API26 and API36 jobs."
