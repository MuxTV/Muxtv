name: Android TV product device matrix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/actions/run-hosted-android-tv/**'
      - '.github/workflows/android-tv-product-device-matrix.yml'
      - 'feature/sources/**'
      - 'catalog/api/src/main/kotlin/app/muxtv/catalog/SourceManagement.kt'
      - 'catalog/api/src/main/kotlin/app/muxtv/catalog/SourceOnboarding.kt'
      - 'app/tv/src/main/kotlin/app/muxtv/sources/**'
      - 'player/api/**'
      - 'player/media3/**'
      - 'tools/android/**'
      - 'tools/measurements/**'
      - 'tools/ci/Test-RiskBasedDeviceLaneContract.ps1'
      - 'tools/ci/Test-HostedAndroidEmulatorBootstrapRetryContract.ps1'
      - 'tools/ci/Assert-AndroidTestResults.ps1'
      - 'tools/ci/Run-HostedAndroidAttempt.sh'
      - 'tools/ci/Run-HostedAndroidProductTests.sh'
      - 'tools/ci/Enable-HostedAndroidKvm.sh'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-tv-product-device-matrix-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  device:
    name: Android TV device API${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            arch: x86
            avd: MuxTV_TV_OLD_API26
            ram: 1536M
          - api: 36
            arch: x86_64
            avd: MuxTV_TV_CURRENT_API36
            ram: 2048M

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up MuxTV JDK toolchains
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Verify exact source commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "Expected exact source $EXPECTED_SHA, got $actual" >&2
            exit 1
          fi

      - name: Enable KVM for Android Emulator
        shell: bash
        env:
          MUXTV_KVM_EVIDENCE: .work/evidence/hosted-android/api-${{ matrix.api }}
        run: bash ./tools/ci/Enable-HostedAndroidKvm.sh

      - name: Run Android TV API${{ matrix.api }} connected tests
        uses: ./.github/actions/run-hosted-android-tv
        env:
          MUXTV_EXPECTED_AVD: ${{ matrix.avd }}
          MUXTV_DEVICE_EVIDENCE: .work/evidence/hosted-android/api-${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          avd-name: ${{ matrix.avd }}
          ram-size: ${{ matrix.ram }}
          evidence-directory: .work/evidence/hosted-android/api-${{ matrix.api }}
          entrypoint: Run-HostedAndroidProductTests.sh

      - name: Upload API${{ matrix.api }} product evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: android-tv-api${{ matrix.api }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/hosted-android/api-${{ matrix.api }}/**
            catalog/importer/build/outputs/androidTest-results/**
            catalog/refresh/build/outputs/androidTest-results/**
            core/credentials/build/outputs/androidTest-results/**
            core/database/build/outputs/androidTest-results/**
            player/media3/build/outputs/androidTest-results/**
            app/tv/build/outputs/androidTest-results/**
          retention-days: 7
          github-token: ${{ github.token }}

  gate:
    name: Android TV product device matrix
    if: always()
    needs:
      - device
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require API26 and API36 matrix success
        shell: bash
        env:
          DEVICE_RESULT: ${{ needs.device.result }}
        run: |
          set -euo pipefail
          if [[ "$DEVICE_RESULT" != "success" ]]; then
            echo "Android TV hosted device matrix result: $DEVICE_RESULT" >&2
            exit 1
          fi
          echo "Android TV hosted device matrix passed for canonical API26 and API36 jobs."
