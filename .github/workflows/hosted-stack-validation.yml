name: Hosted stack validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/hosted-stack-validation.yml'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'build-logic/**'
      - 'benchmark/**'

permissions:
  contents: read

concurrency:
  group: hosted-stack-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Hosted stack compatibility
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact-head provenance
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [[ "$actual_head" != "$EXPECTED_HEAD" ]]; then
            echo "Expected exact PR head $EXPECTED_HEAD but checked out $actual_head" >&2
            exit 1
          fi
          git diff --exit-code
          git diff --cached --exit-code

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3

      - name: Report Gradle and Java versions
        shell: bash
        run: |
          set -euo pipefail
          java -version
          ./gradlew --version --no-daemon --console=plain

      - name: Validate convention build logic
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew -p build-logic :convention:test \
            --no-daemon \
            --console=plain \
            --stacktrace \
            --warning-mode all \
            --no-problems-report

      - name: Validate configuration cache twice
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew help --configuration-cache \
            --no-daemon \
            --console=plain \
            --stacktrace \
            --warning-mode all \
            --no-problems-report
          ./gradlew help --configuration-cache \
            --no-daemon \
            --console=plain \
            --stacktrace \
            --warning-mode all \
            --no-problems-report

      - name: Run stack-sensitive unit and JVM compilation gates
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :app:tv:testDebugUnitTest \
            :core:database:testDebugUnitTest \
            :core:designsystem:testDebugUnitTest \
            :feature:search:testDebugUnitTest \
            :player:media3:testDebugUnitTest \
            :benchmark:jvm:jmhClasses \
            --no-daemon \
            --console=plain \
            --stacktrace \
            --warning-mode all \
            --no-problems-report

      - name: Compile Android instrumentation and benchmark surfaces
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :core:database:assembleDebugAndroidTest \
            :player:media3:assembleDebugAndroidTest \
            :app:tv:assembleDebugAndroidTest \
            :benchmark:macrobenchmark:assembleBenchmarkRelease \
            :benchmark:macrobenchmark:assembleNonMinifiedRelease \
            :app:tv:assembleDebug \
            --no-daemon \
            --console=plain \
            --stacktrace \
            --warning-mode all \
            --no-problems-report
