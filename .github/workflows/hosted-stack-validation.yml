name: Hosted stack validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/hosted-stack-validation.yml'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'build-logic/**'
      - 'benchmark/**'

permissions:
  contents: read

concurrency:
  group: hosted-stack-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Hosted stack compatibility
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact-head provenance
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $actualHead = (& git rev-parse HEAD 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Unable to resolve checked-out HEAD: $actualHead" }
          if ($actualHead -ne $env:EXPECTED_HEAD) {
            throw "Expected exact PR head $env:EXPECTED_HEAD but checked out $actualHead"
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw "Working tree differs from exact PR head." }
          git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) { throw "Index differs from exact PR head." }

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3

      - name: Report Gradle and Java versions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          java -version
          if ($LASTEXITCODE -ne 0) { throw "Java version inspection failed." }
          .\gradlew.bat --version --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) { throw "Gradle version inspection failed." }

      - name: Validate convention build logic
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\gradlew.bat -p build-logic :convention:test `
            --no-daemon `
            --console=plain `
            --stacktrace `
            --warning-mode all `
            --no-problems-report
          if ($LASTEXITCODE -ne 0) { throw "Convention build-logic validation failed." }

      - name: Validate configuration cache twice
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($attempt in 1..2) {
            .\gradlew.bat help --configuration-cache `
              --no-daemon `
              --console=plain `
              --stacktrace `
              --warning-mode all `
              --no-problems-report
            if ($LASTEXITCODE -ne 0) { throw "Configuration-cache validation attempt $attempt failed." }
          }

      - name: Run stack-sensitive unit and JVM compilation gates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\gradlew.bat `
            :app:tv:testDebugUnitTest `
            :core:database:testDebugUnitTest `
            :core:designsystem:testDebugUnitTest `
            :feature:search:testDebugUnitTest `
            :player:media3:testDebugUnitTest `
            :benchmark:jvm:jmhClasses `
            --no-daemon `
            --console=plain `
            --stacktrace `
            --warning-mode all `
            --no-problems-report
          if ($LASTEXITCODE -ne 0) { throw "Stack-sensitive unit/JVM validation failed." }

      - name: Compile Android instrumentation and benchmark surfaces
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\gradlew.bat `
            :core:database:assembleDebugAndroidTest `
            :player:media3:assembleDebugAndroidTest `
            :app:tv:assembleDebugAndroidTest `
            :benchmark:macrobenchmark:assembleBenchmarkRelease `
            :benchmark:macrobenchmark:assembleNonMinifiedRelease `
            :app:tv:assembleDebug `
            --no-daemon `
            --console=plain `
            --stacktrace `
            --warning-mode all `
            --no-problems-report
          if ($LASTEXITCODE -ne 0) { throw "Android instrumentation/benchmark compilation failed." }
