name: Bootstrap Gradle wrapper

on:
  push:
    branches: [feat/phase-00-foundation]
    paths-ignore:
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'

permissions:
  contents: write

jobs:
  wrapper:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/phase-00-foundation
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          gradle-version: '9.5.0'
      - name: Generate wrapper
        run: gradle wrapper --gradle-version 9.5.0 --distribution-type bin
      - name: Commit wrapper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gradlew gradlew.bat gradle/wrapper
          git diff --cached --quiet || git commit -m "build: generate Gradle 9.5 wrapper"
          git push
