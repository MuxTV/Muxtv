# Legacy Test-SelfHostedRunnerPreflightContract compatibility only.
# Shared action owns: if-no-files-found: error; compression-level: 0; actions/upload-artifact@
name: Database migration device matrix

on:
  pull_request:
    branches:
      - main
    paths:
      - catalog/importer/src/main/kotlin/app/muxtv/catalog/importer/EpgRevisionImporter.kt
      - core/database/src/main/kotlin/app/muxtv/database/**
      - core/database/src/androidTest/kotlin/app/muxtv/database/**
      - core/database/schemas/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: database-migration-device-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Database migration device matrix
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, muxtv-android, muxtv-device]
    timeout-minutes: 180

    steps:
      - name: Checkout without pre-clean
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Clean workspace with Windows long paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw "Failed to enable repository-local Git long-path support." }
          git reset --hard HEAD
          if ($LASTEXITCODE -ne 0) { throw "Failed to reset the checked-out workspace." }
          $cleanOutput = (& git clean -ffdx 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Failed to clean the checked-out workspace.`n$cleanOutput" }
          $dirty = (& git status --porcelain=v1 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Failed to inspect the checked-out workspace.`n$dirty" }
          if ($dirty) { throw "Workspace remains dirty after explicit reset/clean.`n$dirty" }

      - name: Verify evidence commit provenance
        shell: pwsh
        run: |
          & .\tools\ci\Assert-EvidenceCommit.ps1 -ExpectedCommit "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Preflight dedicated self-hosted runner
        shell: pwsh
        run: |
          & .\tools\ci\Assert-SelfHostedRunnerPreflight.ps1 `
            -RequireNoConnectedDevice `
            -ExpectedRunnerLabels muxtv-android,muxtv-device `
            -ExpectedSystemImageApis 26,36

      - name: Inspect runner environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          java -version
          if ($LASTEXITCODE -ne 0) { throw "Java runtime inspection failed." }
          . .\tools\android\Initialize-AndroidSdkEnvironment.ps1 -PersistForGitHubActions
          . .\tools\android\AndroidSdk.ps1
          $tools = Get-AndroidSdkTools
          Write-Host "adb=$([System.IO.Path]::GetFileName($tools.Adb))"
          Write-Host "emulator=$([System.IO.Path]::GetFileName($tools.Emulator))"

      - name: Validate Android TV harness syntax
        shell: pwsh
        run: |
          . .\tools\android\Initialize-AndroidSdkEnvironment.ps1
          & .\tools\android\Test-TvHarnessSyntax.ps1

      - name: Run old-edge and current Android TV matrix
        shell: pwsh
        env:
          MUXTV_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          MUXTV_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          . .\tools\android\Initialize-AndroidSdkEnvironment.ps1
          & .\tools\android\Invoke-TvDeviceValidation.ps1 `
            -Mode DeviceMatrix `
            -SourceBranch $env:MUXTV_SOURCE_BRANCH `
            -SourceCommit $env:MUXTV_SOURCE_COMMIT `
            -NoDaemon

      - name: Upload matrix evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: database-migration-device-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/**/*.json
            .work/evidence/**/*.log
            .work/evidence/**/*.txt
            .work/evidence/**/*.png
            core/database/schemas/**/*.json
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          retention-days: 7
          github-token: ${{ github.token }}

      - name: Reset Android runner state
        if: always()
        shell: pwsh
        run: |
          & .\tools\ci\Reset-SelfHostedAndroidState.ps1
