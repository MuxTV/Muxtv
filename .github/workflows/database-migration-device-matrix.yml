name: Database migration device matrix

on:
  pull_request:
    branches:
      - main
    paths:
      - catalog/importer/src/main/kotlin/app/muxtv/catalog/importer/EpgRevisionImporter.kt
      - catalog/importer/src/androidTest/**
      - core/database/src/main/kotlin/app/muxtv/database/**
      - core/database/src/androidTest/kotlin/app/muxtv/database/**
      - core/database/schemas/**
      - tools/ci/Assert-AndroidTestResults.ps1
      - tools/ci/Run-HostedAndroidAttempt.sh
      - tools/ci/Run-HostedDatabaseMigrationTests.sh
      - tools/ci/Enable-HostedAndroidKvm.sh
      - tools/ci/Test-HostedAndroidEmulatorBootstrapRetryContract.ps1
      - '.github/actions/run-hosted-android-tv/**'
      - '.github/workflows/database-migration-device-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: database-migration-device-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  device:
    name: Database migration API${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            arch: x86
            avd: MuxTV_TV_OLD_API26
            ram: 1536M
          - api: 36
            arch: x86_64
            avd: MuxTV_TV_CURRENT_API36
            ram: 2048M

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up MuxTV JDK toolchains
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Enable KVM for Android Emulator
        shell: bash
        env:
          MUXTV_KVM_EVIDENCE: .work/evidence/database-migration/api-${{ matrix.api }}
        run: bash ./tools/ci/Enable-HostedAndroidKvm.sh

      - name: Run database migration API${{ matrix.api }} tests
        uses: ./.github/actions/run-hosted-android-tv
        env:
          MUXTV_EXPECTED_AVD: ${{ matrix.avd }}
          MUXTV_DEVICE_EVIDENCE: .work/evidence/database-migration/api-${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          avd-name: ${{ matrix.avd }}
          ram-size: ${{ matrix.ram }}
          evidence-directory: .work/evidence/database-migration/api-${{ matrix.api }}
          entrypoint: Run-HostedDatabaseMigrationTests.sh

      - name: Upload database migration evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: database-migration-api${{ matrix.api }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/database-migration/api-${{ matrix.api }}/**
            core/database/build/outputs/androidTest-results/**
            catalog/importer/build/outputs/androidTest-results/**
            core/database/schemas/**/*.json
          retention-days: 7
          github-token: ${{ github.token }}

  gate:
    name: Database migration device matrix
    if: always()
    needs:
      - device
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require old-edge and current database coverage
        shell: bash
        env:
          DEVICE_RESULT: ${{ needs.device.result }}
        run: |
          set -euo pipefail
          if [[ "$DEVICE_RESULT" != "success" ]]; then
            echo "Hosted database migration matrix result: $DEVICE_RESULT" >&2
            exit 1
          fi
          echo "Database migration matrix passed on canonical API26 and API36 Android TV emulators."
