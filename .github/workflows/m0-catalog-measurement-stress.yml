name: M0 catalog measurement stress

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: m0-catalog-measurement-stress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stress:
    name: M0 catalog measurement stress
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up MuxTV JDK toolchains
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Verify exact source commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "M0 stress exact-source mismatch: expected=$EXPECTED_SHA actual=$actual" >&2
            exit 1
          fi

      - name: Enable KVM for Android Emulator
        shell: bash
        env:
          MUXTV_KVM_EVIDENCE: .work/evidence/m0-catalog-measurement-stress
        run: bash ./tools/ci/Enable-HostedAndroidKvm.sh

      - name: Run manual 50k x 5 M0 stress on canonical API36
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2, 2026-07-05
        env:
          MUXTV_EXPECTED_AVD: MuxTV_TV_CURRENT_API36
          MUXTV_SOURCE_COMMIT: ${{ github.sha }}
          MUXTV_MEASUREMENT_EVIDENCE: .work/evidence/m0-catalog-measurement-stress
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          avd-name: MuxTV_TV_CURRENT_API36
          force-avd-creation: true
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 4G
          disable-animations: true
          enable-hw-keyboard: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -camera-back none -camera-front none -netdelay none -netspeed full
          script: bash ./tools/ci/Run-HostedCatalogMeasurementStress.sh

      # Manual descriptive evidence only: thresholdApplied=false; claimEligible=false.
      - name: Upload M0 stress evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: m0-catalog-measurement-stress-api36-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/m0-catalog-measurement-stress/**
            core/database/build/outputs/androidTest-results/**
          retention-days: 3
          github-token: ${{ github.token }}
