name: Benchmark foundation dry run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-foundation-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  dry-run:
    name: Benchmark foundation dry run
    runs-on: [self-hosted, Windows, X64, muxtv-android, muxtv-device]
    timeout-minutes: 120

    steps:
      - name: Checkout without pre-clean
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Clean workspace with Windows long paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw "Failed to enable Git long paths." }
          git reset --hard HEAD
          if ($LASTEXITCODE -ne 0) { throw "Failed to reset workspace." }
          git clean -ffdx
          if ($LASTEXITCODE -ne 0) { throw "Failed to clean workspace." }
          if ((git status --porcelain=v1)) { throw "Workspace remains dirty." }

      - name: Verify exact source commit
        shell: pwsh
        run: |
          & .\tools\ci\Assert-EvidenceCommit.ps1 -ExpectedCommit "${{ github.sha }}"

      - name: Initialize Android SDK
        shell: pwsh
        run: |
          . .\tools\android\Initialize-AndroidSdkEnvironment.ps1 -PersistForGitHubActions

      - name: Preflight dedicated benchmark runner
        shell: pwsh
        run: |
          & .\tools\ci\Assert-SelfHostedRunnerPreflight.ps1 `
            -RequireNoConnectedDevice `
            -ExpectedRunnerLabels muxtv-android,muxtv-device `
            -ExpectedSystemImageApis 36

      - name: Validate benchmark foundation contract
        shell: pwsh
        run: |
          & .\tools\ci\Test-BenchmarkFoundationContract.ps1
          & .\tools\android\Test-TvHarnessSyntax.ps1

      - name: Run JMH smoke with GC allocation profiler
        shell: pwsh
        run: |
          .\gradlew.bat :benchmark:jvm:jmh --no-daemon --stacktrace --console=plain -PmuxtvJmhDryRun=true
          if ($LASTEXITCODE -ne 0) { throw "JMH dry-run failed." }

      - name: Run Macrobenchmark CUJ dry run
        shell: pwsh
        env:
          MUXTV_SOURCE_BRANCH: ${{ github.ref_name }}
          MUXTV_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          & .\tools\android\Invoke-BenchmarkDryRun.ps1 `
            -SourceBranch $env:MUXTV_SOURCE_BRANCH `
            -SourceCommit $env:MUXTV_SOURCE_COMMIT `
            -NoDaemon

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-foundation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/**/*.json
            .work/evidence/**/*.log
            .work/evidence/**/*.txt
            .work/evidence/**/*.png
            benchmark/jvm/build/reports/jmh/**
            benchmark/macrobenchmark/build/outputs/androidTest-results/**
            benchmark/macrobenchmark/build/outputs/connected_android_test_additional_output/**
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

      - name: Reset Android runner state
        if: always()
        shell: pwsh
        run: |
          & .\tools\ci\Reset-SelfHostedAndroidState.ps1
