name: Benchmark foundation dry run

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: benchmark-foundation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  jmh:
    name: Benchmark JMH dry run
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up MuxTV JDK toolchains
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Verify benchmark foundation contract
        shell: pwsh
        run: |
          & .\tools\ci\Assert-EvidenceCommit.ps1 -ExpectedCommit "${{ github.sha }}"
          & .\tools\ci\Test-BenchmarkFoundationContract.ps1

      - name: Run JMH smoke with GC allocation profiler
        shell: pwsh
        run: |
          .\gradlew.bat :benchmark:jvm:jmh `
            --no-daemon `
            --stacktrace `
            --console=plain `
            --no-problems-report `
            -PmuxtvJmhDryRun=true
          if ($LASTEXITCODE -ne 0) { throw "JMH dry-run failed." }

      - name: Upload JMH dry-run evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: benchmark-jmh-dry-run-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark/jvm/build/reports/jmh/**
            benchmark/jvm/build/results/jmh/**
          retention-days: 7
          github-token: ${{ github.token }}

  macrobenchmark:
    name: Benchmark Macrobenchmark API36 dry run
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up MuxTV JDK toolchains
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Enable KVM for Android Emulator
        shell: bash
        env:
          MUXTV_KVM_EVIDENCE: .work/evidence/benchmark-hosted-api36
        run: bash ./tools/ci/Enable-HostedAndroidKvm.sh

      - name: Run Macrobenchmark API36 dry run
        uses: ./.github/actions/run-hosted-android-tv
        env:
          MUXTV_EXPECTED_AVD: MuxTV_TV_CURRENT_API36
          MUXTV_BENCHMARK_EVIDENCE: .work/evidence/benchmark-hosted-api36
        with:
          api-level: 36
          arch: x86_64
          avd-name: MuxTV_TV_CURRENT_API36
          ram-size: 2048M
          evidence-directory: .work/evidence/benchmark-hosted-api36
          entrypoint: Run-HostedMacrobenchmarkDryRun.sh

      - name: Upload Macrobenchmark dry-run evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: benchmark-macro-api36-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/benchmark-hosted-api36/**
            benchmark/macrobenchmark/build/outputs/androidTest-results/**
            benchmark/macrobenchmark/build/outputs/connected_android_test_additional_output/**
          retention-days: 7
          github-token: ${{ github.token }}

  gate:
    name: Benchmark foundation dry run
    if: always()
    needs:
      - jmh
      - macrobenchmark
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both dry-run foundations
        shell: bash
        env:
          JMH_RESULT: ${{ needs.jmh.result }}
          MACRO_RESULT: ${{ needs.macrobenchmark.result }}
        run: |
          set -euo pipefail
          if [[ "$JMH_RESULT" != "success" || "$MACRO_RESULT" != "success" ]]; then
            echo "Benchmark foundation failed: jmh=$JMH_RESULT macrobenchmark=$MACRO_RESULT" >&2
            exit 1
          fi
          echo "Benchmark foundation dry run passed. Hosted results validate benchmark correctness only, not longitudinal absolute performance."
