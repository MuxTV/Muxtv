name: Benchmark foundation dry run

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: benchmark-foundation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  jmh:
    name: Benchmark JMH dry run
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up MuxTV JDK toolchains
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Verify benchmark foundation contract
        shell: pwsh
        run: |
          & .\tools\ci\Assert-EvidenceCommit.ps1 -ExpectedCommit "${{ github.sha }}"
          & .\tools\ci\Test-BenchmarkFoundationContract.ps1

      - name: Run JMH smoke with GC allocation profiler
        shell: pwsh
        run: |
          .\gradlew.bat :benchmark:jvm:jmh `
            --no-daemon `
            --stacktrace `
            --console=plain `
            --no-problems-report `
            -PmuxtvJmhDryRun=true
          if ($LASTEXITCODE -ne 0) { throw "JMH dry-run failed." }

      - name: Upload JMH dry-run evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: benchmark-jmh-dry-run-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark/jvm/build/reports/jmh/**
            benchmark/jvm/build/results/jmh/**
          retention-days: 7
          github-token: ${{ github.token }}

  macrobenchmark:
    name: Benchmark Macrobenchmark API36 dry run
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up MuxTV JDK toolchains
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Enable KVM for Android Emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run Macrobenchmark API36 dry run
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2, 2026-07-05
        env:
          MUXTV_EXPECTED_AVD: MuxTV_TV_CURRENT_API36
          MUXTV_BENCHMARK_EVIDENCE: .work/evidence/benchmark-hosted-api36
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          avd-name: MuxTV_TV_CURRENT_API36
          force-avd-creation: true
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 4G
          disable-animations: true
          enable-hw-keyboard: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -camera-back none -camera-front none -netdelay none -netspeed full
          script: |
            set -eu
            mkdir -p "$MUXTV_BENCHMARK_EVIDENCE"
            avdmanager list avd -c | tee "$MUXTV_BENCHMARK_EVIDENCE/avd-inventory.txt"
            avd_count="$(sed '/^[[:space:]]*$/d' "$MUXTV_BENCHMARK_EVIDENCE/avd-inventory.txt" | wc -l | tr -d '[:space:]')"
            avd_name="$(sed '/^[[:space:]]*$/d' "$MUXTV_BENCHMARK_EVIDENCE/avd-inventory.txt" | head -n 1)"
            if [ "$avd_count" -ne 1 ] || [ "$avd_name" != "$MUXTV_EXPECTED_AVD" ]; then
              echo "Expected exactly canonical AVD $MUXTV_EXPECTED_AVD; count=$avd_count first=$avd_name" >&2
              exit 1
            fi
            chmod +x ./gradlew
            ./gradlew \
              :benchmark:macrobenchmark:connectedBenchmarkReleaseAndroidTest \
              --no-daemon \
              --stacktrace \
              --console=plain \
              --no-problems-report \
              -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.dryRunMode.enable=true \
              -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark
            pwsh -NoProfile -Command '& "./tools/ci/Assert-AndroidTestResults.ps1" -ModulePaths @("benchmark/macrobenchmark") -OutputPath (Join-Path $env:MUXTV_BENCHMARK_EVIDENCE "android-test-results.json")'

      - name: Upload Macrobenchmark dry-run evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: benchmark-macro-api36-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/benchmark-hosted-api36/**
            benchmark/macrobenchmark/build/outputs/androidTest-results/**
            benchmark/macrobenchmark/build/outputs/connected_android_test_additional_output/**
          retention-days: 7
          github-token: ${{ github.token }}

  gate:
    name: Benchmark foundation dry run
    if: always()
    needs:
      - jmh
      - macrobenchmark
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both dry-run foundations
        shell: bash
        env:
          JMH_RESULT: ${{ needs.jmh.result }}
          MACRO_RESULT: ${{ needs.macrobenchmark.result }}
        run: |
          set -euo pipefail
          if [[ "$JMH_RESULT" != "success" || "$MACRO_RESULT" != "success" ]]; then
            echo "Benchmark foundation failed: jmh=$JMH_RESULT macrobenchmark=$MACRO_RESULT" >&2
            exit 1
          fi
          echo "Benchmark foundation dry run passed. Hosted results validate benchmark correctness only, not longitudinal absolute performance."
