name: LC04 authenticated TV reply lab

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/local-control-authenticated-reply-lab.yml'
      - 'local-control/crypto-lab/**'
      - 'settings.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lc04-authenticated-reply-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  signed-reply:
    name: Signed HPKE and authenticated TV reply JVM
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up pinned MuxTV JDKs
        uses: ./.github/actions/setup-muxtv-jdks
      - name: Enforce exact source SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Run authenticated reply and signed HPKE laboratory regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :local-control:crypto-lab:test --no-daemon --stacktrace --console=plain --no-problems-report
      - name: Upload public test result XML
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: lc04-signed-reply-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            local-control/crypto-lab/build/test-results/test/**
          retention-days: 7
          github-token: ${{ github.token }}
