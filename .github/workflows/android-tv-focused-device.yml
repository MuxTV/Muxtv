name: Android TV focused device

on:
  pull_request:
    branches:
      - main
    paths:
      - app/tv/src/**
      - feature/home/**
      - feature/channels/**
      - feature/guide/**
      - feature/search/**
      - feature/sources/**
      - feature/doctor/**
      - feature/settings/**
      - feature/player/**
      - player/api/**
      - player/media3/**
      - core/designsystem/**
      - core/ui/**
      - tools/ci/Assert-AndroidTestResults.ps1
      - tools/ci/Run-HostedAndroidProductTests.sh
      - tools/ci/Enable-HostedAndroidKvm.sh
      - '.github/workflows/android-tv-focused-device.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-tv-focused-device-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Android TV focused device
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up MuxTV JDK toolchains
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Verify exact source commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "Expected exact source $EXPECTED_SHA, got $actual" >&2
            exit 1
          fi

      - name: Enable KVM for Android Emulator
        shell: bash
        env:
          MUXTV_KVM_EVIDENCE: .work/evidence/hosted-android/focused-api36
        run: bash ./tools/ci/Enable-HostedAndroidKvm.sh

      - name: Run focused Android TV API36 connected tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2, 2026-07-05
        env:
          MUXTV_EXPECTED_AVD: MuxTV_TV_CURRENT_API36
          MUXTV_DEVICE_EVIDENCE: .work/evidence/hosted-android/focused-api36
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          avd-name: MuxTV_TV_CURRENT_API36
          force-avd-creation: true
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 4G
          enable-hw-keyboard: true
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -camera-back none -camera-front none -netdelay none -netspeed full
          script: bash ./tools/ci/Run-HostedAndroidProductTests.sh

      - name: Upload focused device evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: android-tv-focused-api36-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/hosted-android/focused-api36/**
            catalog/importer/build/outputs/androidTest-results/**
            catalog/refresh/build/outputs/androidTest-results/**
            core/credentials/build/outputs/androidTest-results/**
            core/database/build/outputs/androidTest-results/**
            player/media3/build/outputs/androidTest-results/**
            app/tv/build/outputs/androidTest-results/**
          retention-days: 7
          github-token: ${{ github.token }}
