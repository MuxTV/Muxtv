name: Accepted main focused M3U evidence

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/focused-m3u-evidence.yml
      - tools/ci/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradle/**
      - gradlew
      - gradlew.bat
      - build-logic/**
      - tools/measurements/Invoke-M3uCorpusSeries.ps1
      - tools/measurements/Finalize-MeasurementSeriesEvidence.ps1
      - tools/measurements/Test-MeasurementHarnessSyntax.ps1
      - tools/measurements/Test-M3uSeriesFinalizerContract.ps1
      - tools/measurements/Test-M3uSeriesManifestPublicationContract.ps1
      - tools/measurements/Test-FocusedM3uEvidenceWorkflowContract.ps1
      - core/testing/**
      - catalog/ingest/**

permissions:
  contents: read

concurrency:
  group: focused-m3u-accepted-main
  cancel-in-progress: false

jobs:
  focused-m3u:
    name: Accepted main 5x10k + 5x50k M3U evidence
    runs-on: [self-hosted, Windows, X64, muxtv-android]
    timeout-minutes: 180

    steps:
      - name: Checkout accepted source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Require accepted main ref
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -cne "refs/heads/main") {
            throw "Focused claim-eligible M3U evidence must run from refs/heads/main."
          }

      - name: Clean workspace with Windows long paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.longpaths true
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to enable repository-local Git long-path support."
          }

          git reset --hard HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to reset the checked-out workspace."
          }

          $cleanOutput = (& git clean -ffdx 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clean the checked-out workspace.`n$cleanOutput"
          }

          $dirty = (& git status --porcelain=v1 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $dirty) {
            throw "Workspace is not clean after explicit reset/clean.`n$dirty"
          }

          $evidenceDirectory = ".work\evidence\workspace-cleanup"
          New-Item -ItemType Directory -Force -Path $evidenceDirectory | Out-Null
          @(
            "git_version=$(git --version)"
            "core_longpaths=$(git config --local --get core.longpaths)"
            "workspace_clean=true"
            "clean_output=$cleanOutput"
          ) | Set-Content -Path (Join-Path $evidenceDirectory "workspace-cleanup.log") -Encoding utf8

      - name: Verify evidence commit provenance
        shell: pwsh
        run: |
          $expectedCommit = "${{ github.sha }}"
          & .\tools\ci\Assert-EvidenceCommit.ps1 -ExpectedCommit $expectedCommit

      - name: Preflight dedicated self-hosted runner
        shell: pwsh
        run: |
          & .\tools\ci\Assert-SelfHostedRunnerPreflight.ps1 `
            -SkipAndroidToolchain `
            -ExpectedRunnerLabels muxtv-android

      - name: Inspect runner environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $evidenceDirectory = ".work\evidence\focused-m3u-environment"
          New-Item -ItemType Directory -Force -Path $evidenceDirectory | Out-Null

          $javaVersion = @(& java -version 2>&1)
          if ($LASTEXITCODE -ne 0) {
            throw "Java runtime inspection failed."
          }
          $processor = Get-CimInstance Win32_Processor | Select-Object -First 1
          @(
            "runner=$env:RUNNER_NAME"
            "os=$env:RUNNER_OS"
            "architecture=$env:RUNNER_ARCH"
            "processor=$($processor.Name)"
            "logical_processors=$($processor.NumberOfLogicalProcessors)"
            "java=$([string]::Join(' | ', $javaVersion))"
          ) | Set-Content -Path (Join-Path $evidenceDirectory "environment.log") -Encoding utf8

      - name: Validate focused measurement harness
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\measurements\Test-MeasurementHarnessSyntax.ps1

      - name: Run medium 10k focused series
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\measurements\Invoke-M3uCorpusSeries.ps1 `
            -SourceBranch main `
            -SourceCommit "${{ github.sha }}" `
            -M3uProfile medium-10k `
            -M3uSeed 20260728 `
            -Repetitions 5 `
            -RunnerLabel self-hosted-windows-x64-v1 `
            -NoDaemon

      - name: Run large 50k focused series
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\measurements\Invoke-M3uCorpusSeries.ps1 `
            -SourceBranch main `
            -SourceCommit "${{ github.sha }}" `
            -M3uProfile large-50k `
            -M3uSeed 20260728 `
            -Repetitions 5 `
            -RunnerLabel self-hosted-windows-x64-v1 `
            -NoDaemon

      - name: Finalize interrupted focused evidence
        if: always()
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\measurements\Finalize-MeasurementSeriesEvidence.ps1 `
            -EvidenceRoot .work\evidence

      - name: Upload focused M3U evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: focused-m3u-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/**/*.json
            .work/evidence/**/*.log
            .work/evidence/**/*.txt
            core/testing/build/measurements/*.json
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 30

      - name: Reset Android runner state
        if: always()
        shell: pwsh
        run: |
          & .\tools\ci\Reset-SelfHostedAndroidState.ps1
