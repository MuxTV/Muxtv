name: Manual hosted M3U stress evidence

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: focused-m3u-hosted-stress
  cancel-in-progress: false

jobs:
  focused-m3u:
    name: Manual 4x10k + 4x50k hosted M3U stress evidence
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout accepted source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Require accepted main ref
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -cne "refs/heads/main") {
            throw "Hosted M3U stress evidence must run from refs/heads/main."
          }

      - name: Verify evidence commit provenance
        shell: pwsh
        run: |
          & .\tools\ci\Assert-EvidenceCommit.ps1 -ExpectedCommit "${{ github.sha }}"

      - name: Record ephemeral hosted environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $evidenceDirectory = ".work\evidence\focused-m3u-environment"
          New-Item -ItemType Directory -Force -Path $evidenceDirectory | Out-Null
          $javaVersion = @(& java -version 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Java runtime inspection failed." }
          $processor = Get-CimInstance Win32_Processor | Select-Object -First 1
          @(
            "runner_environment=github-hosted-ephemeral"
            "runner=$env:RUNNER_NAME"
            "os=$env:RUNNER_OS"
            "architecture=$env:RUNNER_ARCH"
            "processor=$($processor.Name)"
            "logical_processors=$($processor.NumberOfLogicalProcessors)"
            "java=$([string]::Join(' | ', $javaVersion))"
            "longitudinal_absolute_performance_claims=false"
          ) | Set-Content -Path (Join-Path $evidenceDirectory "environment.log") -Encoding utf8

      - name: Validate focused measurement harness
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\measurements\Test-MeasurementHarnessSyntax.ps1

      - name: Run medium 10k hosted exploratory series
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\measurements\Invoke-M3uCorpusSeries.ps1 `
            -SourceBranch main `
            -SourceCommit "${{ github.sha }}" `
            -M3uProfile medium-10k `
            -M3uSeed 20260728 `
            -Repetitions 4 `
            -RunnerLabel github-hosted-windows-x64-v1 `
            -NoDaemon

      - name: Run large 50k hosted exploratory series
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\measurements\Invoke-M3uCorpusSeries.ps1 `
            -SourceBranch main `
            -SourceCommit "${{ github.sha }}" `
            -M3uProfile large-50k `
            -M3uSeed 20260728 `
            -Repetitions 4 `
            -RunnerLabel github-hosted-windows-x64-v1 `
            -NoDaemon

      - name: Finalize interrupted focused evidence
        if: always()
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\measurements\Finalize-MeasurementSeriesEvidence.ps1 `
            -EvidenceRoot .work\evidence

      - name: Upload hosted M3U evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: focused-m3u-hosted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/**/*.json
            .work/evidence/**/*.log
            .work/evidence/**/*.txt
            core/testing/build/measurements/*.json
          retention-days: 7
          github-token: ${{ github.token }}
