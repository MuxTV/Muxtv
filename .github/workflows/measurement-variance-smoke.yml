name: Measurement variance smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - core/testing/src/main/kotlin/app/muxtv/testing/measurements/**
      - core/testing/src/test/kotlin/app/muxtv/testing/measurements/**
      - tools/measurements/**
      - tools/android/Invoke-CatalogDatabaseMeasurement.ps1
      - tools/android/Invoke-PlayerProxyMeasurement.ps1
      - '.github/workflows/measurement-variance-smoke.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  methodology-smoke:
    name: Measurement methodology smoke
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify exact source commit
        shell: pwsh
        run: |
          $expected = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          & .\tools\ci\Assert-EvidenceCommit.ps1 -ExpectedCommit $expected

      - name: Validate measurement harness contracts
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\measurements\Test-MeasurementHarnessSyntax.ps1

      - name: Run measurement analysis unit tests
        shell: pwsh
        run: |
          .\gradlew.bat :core:testing:test `
            --no-daemon `
            --stacktrace `
            --console=plain `
            --no-problems-report
          if ($LASTEXITCODE -ne 0) { throw "Measurement analysis unit tests failed." }

      - name: Run deterministic two-repeat M3U variance smoke
        shell: pwsh
        env:
          MUXTV_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          MUXTV_SOURCE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          pwsh -NoProfile -File .\tools\measurements\Invoke-M3uCorpusSeries.ps1 `
            -SourceBranch $env:MUXTV_SOURCE_BRANCH `
            -SourceCommit $env:MUXTV_SOURCE_COMMIT `
            -M3uProfile small-1k `
            -M3uSeed 20260728 `
            -Repetitions 2 `
            -RunnerLabel github-hosted-windows-x64-v1 `
            -NoDaemon

      - name: Assert hosted smoke remains non-claim-eligible
        shell: pwsh
        run: |
          $manifests = @(Get-ChildItem .work\evidence -Recurse -File -Filter 'm3u-series-run-manifest.json')
          if ($manifests.Count -ne 1) {
            throw "Expected exactly one M3U smoke manifest, got $($manifests.Count)."
          }
          $manifest = Get-Content -LiteralPath $manifests[0].FullName -Raw | ConvertFrom-Json
          if ([bool]$manifest.claimEligible) {
            throw "GitHub-hosted measurement smoke must never be claim-eligible."
          }
          if ([string]$manifest.status -cne 'passed') {
            throw "Hosted measurement smoke did not complete successfully."
          }
          Write-Host "Hosted measurement smoke is correctness-only and non-claim-eligible."

      - name: Finalize interrupted series manifests
        if: always()
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\measurements\Finalize-MeasurementSeriesEvidence.ps1 -EvidenceRoot .work\evidence

      - name: Upload methodology smoke evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: measurement-methodology-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/**/*.json
            .work/evidence/**/*.log
            .work/evidence/**/*.txt
            core/testing/build/measurements/*.json
          retention-days: 7
          github-token: ${{ github.token }}
