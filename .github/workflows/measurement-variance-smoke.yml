name: Measurement variance smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - core/testing/src/main/kotlin/app/muxtv/testing/measurements/**
      - core/testing/src/test/kotlin/app/muxtv/testing/measurements/**
      - tools/measurements/**
      - tools/android/Invoke-CatalogDatabaseMeasurement.ps1
      - tools/android/Invoke-PlayerProxyMeasurement.ps1

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  current-profile-smoke:
    name: Current Android TV variance smoke
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, muxtv-android, muxtv-device]
    timeout-minutes: 180

    steps:
      - name: Checkout without pre-clean
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Clean workspace with Windows long paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw "Failed to enable repository-local Git long-path support." }
          git reset --hard HEAD
          if ($LASTEXITCODE -ne 0) { throw "Failed to reset the checked-out workspace." }
          $cleanOutput = (& git clean -ffdx 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Failed to clean the checked-out workspace.`n$cleanOutput" }
          $dirty = (& git status --porcelain=v1 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw "Workspace is not clean after reset and clean." }

      - name: Verify evidence commit provenance
        shell: pwsh
        run: |
          $expectedCommit = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          & .\tools\ci\Assert-EvidenceCommit.ps1 -ExpectedCommit $expectedCommit

      - name: Preflight dedicated self-hosted runner
        shell: pwsh
        run: |
          & .\tools\ci\Assert-SelfHostedRunnerPreflight.ps1 `
            -RequireNoConnectedDevice `
            -ExpectedRunnerLabels muxtv-android,muxtv-device `
            -ExpectedSystemImageApis 36

      - name: Resolve Android SDK and validate harness
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . .\tools\android\Initialize-AndroidSdkEnvironment.ps1 -PersistForGitHubActions
          . .\tools\android\AndroidSdk.ps1
          $tools = Get-AndroidSdkTools
          Write-Host "Android SDK tools resolved."
          Write-Host "adb=$([System.IO.Path]::GetFileName($tools.Adb))"
          Write-Host "emulator=$([System.IO.Path]::GetFileName($tools.Emulator))"
          & .\tools\android\Test-TvHarnessSyntax.ps1

      - name: Start repository-selected ADB server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . .\tools\android\Initialize-AndroidSdkEnvironment.ps1
          . .\tools\android\AndroidSdk.ps1
          $tools = Get-AndroidSdkTools
          $evidenceDirectory = ".work\evidence\measurement-adb"
          New-Item -ItemType Directory -Force -Path $evidenceDirectory | Out-Null
          $logPath = Join-Path $evidenceDirectory "adb-server.log"
          & $tools.Adb version 2>&1 | Set-Content -Path $logPath -Encoding utf8
          & $tools.Adb kill-server 2>&1 | Add-Content -Path $logPath -Encoding utf8
          Start-Sleep -Seconds 1
          & $tools.Adb start-server 2>&1 | Add-Content -Path $logPath -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "Unable to start the repository-selected ADB server." }
          & $tools.Adb devices -l 2>&1 | Add-Content -Path $logPath -Encoding utf8

      - name: Run two current-profile variance repetitions
        shell: pwsh
        env:
          MUXTV_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          MUXTV_SOURCE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          . .\tools\android\Initialize-AndroidSdkEnvironment.ps1
          & .\tools\measurements\Invoke-MeasurementSeries.ps1 `
            -SourceBranch $env:MUXTV_SOURCE_BRANCH `
            -SourceCommit $env:MUXTV_SOURCE_COMMIT `
            -ProfileId current-normal `
            -Repetitions 2 `
            -EvidenceRoot .work\evidence `
            -NoDaemon

      - name: Finalize interrupted series manifests
        if: always()
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\measurements\Finalize-MeasurementSeriesEvidence.ps1 -EvidenceRoot .work\evidence

      - name: Upload variance evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: measurement-variance-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/**/*.json
            .work/evidence/**/*.log
            .work/evidence/**/*.txt
            .work/evidence/**/*.png
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          retention-days: 14
          github-token: ${{ github.token }}

      - name: Reset Android runner state
        if: always()
        shell: pwsh
        run: |
          & .\tools\ci\Reset-SelfHostedAndroidState.ps1
