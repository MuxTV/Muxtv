name: Phase 00 red gate

on:
  push:
    branches: [feat/phase-00-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  convention-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          gradle-version: '9.5.0'
      - name: Run convention tests
        run: gradle -p build-logic :convention:test --stacktrace
