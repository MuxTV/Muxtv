name: Phase 00 foundation (legacy manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase00-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - name: Run focused TV shell and diagnostics gate
        shell: bash
        run: |
          set +e
          ./gradlew :core:common:test :core:designsystem:testDebugUnitTest :app:tv:testDebugUnitTest --stacktrace > phase00-build.log 2>&1
          status=$?
          tail -n 120 phase00-build.log
          exit "$status"
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase00-build-log
          path: phase00-build.log
          if-no-files-found: error
          retention-days: 3
