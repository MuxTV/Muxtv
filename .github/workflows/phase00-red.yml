name: Phase 00 build foundation

on:
  push:
    branches: [feat/phase-00-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  convention-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate wrapper and convention tests
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          set +e
          {
            ./gradlew --version
            ./gradlew help --configuration-cache
            ./gradlew help --configuration-cache
            ./gradlew -p build-logic :convention:test --stacktrace
          } > phase00-build.log 2>&1
          status=$?
          tail -n 30 phase00-build.log
          exit "$status"
