name: Phase 00 build foundation

on:
  push:
    branches: [feat/phase-00-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  convention-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          gradle-version: '9.5.0'
      - name: Generate wrapper and validate conventions
        shell: bash
        run: |
          set +e
          {
            gradle wrapper --gradle-version 9.5.0 --distribution-type bin
            gradle help --configuration-cache
            gradle help --configuration-cache
            gradle -p build-logic :convention:test --stacktrace
          } > phase00-build.log 2>&1
          status=$?
          tail -n 40 phase00-build.log
          exit "$status"
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase00-build-log
          path: phase00-build.log
          if-no-files-found: error
          retention-days: 3
      - name: Upload generated wrapper jar
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gradle-wrapper-jar
          path: gradle/wrapper/gradle-wrapper.jar
          if-no-files-found: error
          retention-days: 3
