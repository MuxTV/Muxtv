name: Phase 00 build foundation

on:
  push:
    branches: [feat/phase-00-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  convention-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - name: Validate wrapper and convention tests
        shell: bash
        run: |
          set +e
          {
            ./gradlew --version
            ./gradlew help --configuration-cache
            ./gradlew help --configuration-cache
            ./gradlew -p build-logic :convention:test --stacktrace
          } > phase00-build.log 2>&1
          status=$?
          tail -n 120 phase00-build.log
          exit "$status"
