name: Phase 00 foundation

on:
  push:
    branches: [feat/phase-00-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phase00-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - name: Validate wrapper, build and contract tests
        shell: bash
        run: |
          set +e
          {
            ./gradlew --version
            ./gradlew help --configuration-cache
            ./gradlew help --configuration-cache
            ./gradlew -p build-logic :convention:test
            ./gradlew :core:testing:test :core:model:test :player:api:test :player:fake:test
            ./gradlew :core:database:compileDebugAndroidTestKotlin --stacktrace
          } > phase00-build.log 2>&1
          status=$?
          tail -n 100 phase00-build.log
          exit "$status"
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase00-build-log
          path: phase00-build.log
          if-no-files-found: error
          retention-days: 3
