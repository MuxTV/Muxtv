name: C03 schema bootstrap (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/c03-schema-bootstrap.yml'
permissions:
  contents: read
jobs:
  export-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Extract generated schema from exact-source CI archive
        shell: bash
        run: |
          set -euo pipefail
          # Source CI commit c5f8b53 differs from this head only by a Kotlin test fix
          # and the temporary export workflow. No production schema sources changed.
          # KSP generates Room 11.json; the finalizer is expected to fail until committed.
          ./gradlew --no-daemon :core:database:compileDebugKotlin > /tmp/c03-schema-gradle.log 2>&1 || true
          schema="core/database/schemas/app.muxtv.database.MuxTvDatabase/11.json"
          if [[ ! -s "$schema" ]]; then
            tail -n 160 /tmp/c03-schema-gradle.log
            exit 1
          fi
          test -s "$schema"
          echo "60789f3f65c415e94e05fb66c6793808764e4fd3a2156dc7642fe0e2029fede4  $schema" | sha256sum -c -
          python3 - "$schema" <<'PY'
          import base64, hashlib, json, pathlib, sys
          contents = pathlib.Path(sys.argv[1]).read_bytes()
          assert json.loads(contents)['database']['version'] == 11
          print('C03_SCHEMA_SHA256=' + hashlib.sha256(contents).hexdigest())
          print('C03_SCHEMA_BEGIN')
          encoded = base64.b64encode(contents).decode('ascii')
          for i in range(0, len(encoded), 1000):
              print(encoded[i:i+1000])
          print('C03_SCHEMA_END')
          PY
