name: Commit Room v7 schema

on:
  push:
    branches:
      - fix/epg-matching-now-next-71

permissions:
  contents: write

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/epg-matching-now-next-71
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate Room schema
        run: ./gradlew :core:database:compileDebugKotlin --no-daemon --stacktrace --console=plain
      - name: Commit generated v7 schema
        shell: bash
        run: |
          set -euo pipefail
          schema='core/database/schemas/app.muxtv.database.MuxTvDatabase/7.json'
          test -f "$schema"
          if [[ -z "$(git status --porcelain -- "$schema")" ]]; then
            echo 'Room v7 schema is already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$schema"
          git commit -m 'chore: commit Room schema v7'
          git push origin HEAD:fix/epg-matching-now-next-71
