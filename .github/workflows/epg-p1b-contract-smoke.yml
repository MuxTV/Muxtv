name: EPG P1B contract smoke

on:
  push:
    branches:
      - wip/epg-refresh-access-guard-70
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  compile-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run EPG scheduler unit contracts
        run: ./gradlew :catalog:sync:testDebugUnitTest --no-daemon --stacktrace --console=plain
