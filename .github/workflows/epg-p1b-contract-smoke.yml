name: EPG P1B contract smoke

on:
  push:
    branches:
      - wip/epg-refresh-access-guard-70
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  compile-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run focused EPG P1B contracts
        run: ./gradlew :catalog:sync:compileDebugUnitTestKotlin :core:database:testDebugUnitTest --tests app.muxtv.database.EpgRefreshEntityRedactionTest --no-daemon --stacktrace --console=plain
