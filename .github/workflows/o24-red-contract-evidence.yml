name: O2.4 RED contract evidence

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Benchmark O2.4 contract RED
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify evidence commit provenance
        shell: pwsh
        run: |
          $expectedCommit = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          & .\tools\ci\Assert-EvidenceCommit.ps1 -ExpectedCommit $expectedCommit

      - name: Run Benchmark O2.4 contract
        shell: pwsh
        run: |
          & .\tools\ci\Test-BenchmarkFoundationContract.ps1
