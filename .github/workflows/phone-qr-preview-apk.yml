name: LC04 Native Phone QR Preview APK

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/phone-qr-preview-apk.yml'
      - 'app/phone/**'
      - 'local-control/qr-contract/**'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lc04-native-phone-apk-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preview:
    name: Compile offline Android phone APK and QR parser
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up pinned MuxTV toolchains
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Verify exact checked-out commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Qualify QR parser and assemble phone debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew             :local-control:qr-contract:test             :app:phone:testDebugUnitTest             :app:phone:assembleDebug             --no-daemon --console=plain --no-problems-report
          test -s app/phone/build/outputs/apk/debug/phone-debug.apk

      - name: Upload test-only preview APK
        if: success()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: lc04-phone-qr-debug-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/phone/build/outputs/apk/debug/phone-debug.apk
          retention-days: 7
          github-token: ${{ github.token }}
