name: Bootstrap Room schema fixtures (hosted)

on:
  push:
    branches:
      - feat/epg-refresh-state-70
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: write

jobs:
  bootstrap-room-schemas-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: feat/epg-refresh-state-70

      - name: Restore exact Room v5 and v6 schema exports
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          schema_dir='core/database/schemas/app.muxtv.database.MuxTvDatabase'
          mkdir -p "$schema_dir" /tmp/muxtv-room-v5 /tmp/muxtv-room-v6

          curl --fail-with-body --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/8806681627/zip" \
            --output /tmp/muxtv-room-v5.zip
          unzip -q /tmp/muxtv-room-v5.zip -d /tmp/muxtv-room-v5

          curl --fail-with-body --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/8819069625/zip" \
            --output /tmp/muxtv-room-v6.zip
          unzip -q /tmp/muxtv-room-v6.zip -d /tmp/muxtv-room-v6

          v5='/tmp/muxtv-room-v5/core/database/schemas/app.muxtv.database.MuxTvDatabase/5.json'
          v6='/tmp/muxtv-room-v6/.work/evidence/room-schemas/app.muxtv.database.MuxTvDatabase/6.json'
          test "$(sha256sum "$v5" | cut -d' ' -f1)" = 'e9cdb2916bd51dee33e62e957b0612946fef50d2f383222286719cead0102f10'
          test "$(sha256sum "$v6" | cut -d' ' -f1)" = '7468d52b010ad36096e02492c727659df8228cdd336189f2be5a23af9589764a'

          cp "$v5" "$schema_dir/5.json"
          cp "$v6" "$schema_dir/6.json"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$schema_dir/5.json" "$schema_dir/6.json"
          if git diff --cached --quiet; then
            echo 'Exact Room schema fixtures are already committed.'
            exit 0
          fi
          git commit -m 'test(database): commit exact Room v5 and v6 schemas'
          git push origin HEAD:feat/epg-refresh-state-70
