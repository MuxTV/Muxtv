name: LC04 one-shot TV reply guard lab

on:
  pull_request:
    branches:
      - main
      - research/401-lc04-typed-transcript-20261018
    paths:
      - '.github/workflows/local-control-reply-guard-lab.yml'
      - 'local-control/wire-lab/**'
      - 'settings.gradle.kts'
      - '.work/meta/modules.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lc04-reply-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reply-state:
    name: TV reply replay expiry revocation hostile JVM
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up pinned MuxTV JDKs
        uses: ./.github/actions/setup-muxtv-jdks
      - name: Require exact tested revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Run all replay and cryptographic transcript regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :local-control:wire-lab:test :app:tv:compileDebugKotlin :app:phone:assembleDebug --no-daemon --stacktrace --console=plain --no-problems-report
      - name: Upload secret-free JVM test XML
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: lc04-reply-guard-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            local-control/wire-lab/build/test-results/test/**
          retention-days: 7
          github-token: ${{ github.token }}
