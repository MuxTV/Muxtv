name: C03 Room evidence runner

on:
  push:
    branches:
      - evidence/c03-room-874b0c

permissions:
  contents: write
  actions: read

jobs:
  measure:
    name: C03 candidate audit GREEN executor
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      C03_EXPECTED_HEAD: 874b0c56848c74e85285712a12c5b09600e4f2aa
      C03_BRANCH: feature/c03-refresh-delta
      MUXTV_EXPECTED_AVD: MuxTV_TV_CURRENT_API36
      MUXTV_EVIDENCE_DIR: .work/evidence/c03-room
    steps:
      - name: Checkout C03 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.C03_BRANCH }}
          persist-credentials: true
          fetch-depth: 1

      - name: Set up MuxTV JDK toolchains
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Assert expected RED head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$C03_EXPECTED_HEAD"
          mkdir -p "$MUXTV_EVIDENCE_DIR"
          printf 'preFixHead=%s\nworkflowCommit=%s\n' "$actual" "${{ github.sha }}" > "$MUXTV_EVIDENCE_DIR/provenance.txt"

      - name: Fetch patch executor from evidence branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin evidence/c03-room-874b0c:refs/remotes/origin/evidence/c03-room-874b0c
          git show "origin/evidence/c03-room-874b0c:tools/ci/Patch-C03CandidateAudit.py" > /tmp/Patch-C03CandidateAudit.py
          test -s /tmp/Patch-C03CandidateAudit.py

      - name: Apply measurement-only candidate audit fix
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/Patch-C03CandidateAudit.py
          git diff --check

      - name: Enable KVM for Android Emulator
        shell: bash
        env:
          MUXTV_KVM_EVIDENCE: .work/evidence/c03-room/kvm
        run: bash ./tools/ci/Enable-HostedAndroidKvm.sh

      - name: Verify GREEN before commit
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2, 2026-07-05
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          avd-name: MuxTV_TV_CURRENT_API36
          force-avd-creation: true
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 4G
          enable-hw-keyboard: true
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -camera-back none -camera-front none -netdelay none -netspeed full
          script: |
            set -eu
            chmod +x ./gradlew
            rm -rf core/database/build/outputs/androidTest-results/connected/debug
            ./gradlew :core:database:connectedDebugAndroidTest --no-daemon --stacktrace --console=plain --no-problems-report -PcatalogMeasurements=true -Pandroid.testInstrumentationRunnerArguments.class=app.muxtv.database.RefreshDeltaDatabaseMeasurementTest -Pandroid.testInstrumentationRunnerArguments.c03SourceCommit=$C03_EXPECTED_HEAD -Pandroid.testInstrumentationRunnerArguments.c03Warmups=0 -Pandroid.testInstrumentationRunnerArguments.c03Iterations=1

      - name: Commit verified measurement fix to C03 branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/database/src/debug/kotlin/app/muxtv/database/measurement/RefreshDeltaDatabaseMeasurementRunner.kt
          git commit -m "fix(c03): audit candidate physical row mutations"
          git push origin HEAD:${C03_BRANCH}
          printf 'committedHead=%s\n' "$(git rev-parse HEAD)" >> "$MUXTV_EVIDENCE_DIR/provenance.txt"

      - name: Upload GREEN test evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: c03-room-fix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/c03-room/**
            core/database/build/outputs/androidTest-results/**
          retention-days: 7
          github-token: ${{ github.token }}
