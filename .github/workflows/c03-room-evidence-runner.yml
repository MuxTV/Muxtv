name: C03 Room evidence runner

on:
  push:
    branches:
      - evidence/c03-room-874b0c

permissions:
  contents: write
  actions: read

jobs:
  measure:
    name: C03 candidate audit GREEN executor
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      C03_EXPECTED_HEAD: 874b0c56848c74e85285712a12c5b09600e4f2aa
      C03_BRANCH: feature/c03-refresh-delta
      MUXTV_EXPECTED_AVD: MuxTV_TV_CURRENT_API36
      MUXTV_EVIDENCE_DIR: .work/evidence/c03-room
    steps:
      - name: Checkout C03 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.C03_BRANCH }}
          persist-credentials: true
          fetch-depth: 1

      - name: Set up MuxTV JDK toolchains
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Assert expected RED head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$C03_EXPECTED_HEAD"
          mkdir -p "$MUXTV_EVIDENCE_DIR"
          printf 'preFixHead=%s\nworkflowCommit=%s\n' "$actual" "${{ github.sha }}" > "$MUXTV_EVIDENCE_DIR/provenance.txt"

      - name: Apply measurement-only candidate audit fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('core/database/src/debug/kotlin/app/muxtv/database/measurement/RefreshDeltaDatabaseMeasurementRunner.kt')
          text = path.read_text()

          old = '''                        RefreshDeltaDatabaseVariant.B_IMMUTABLE_COW -> {
                            val counts = samples.map { it.sample.observedRowMutations }.distinct()
                            check(counts.size == 1) { "C03 candidate row mutations were not deterministic." }
                            mapOf("sqlite.total_changes" to counts.single())
                        }'''
          new = '''                        RefreshDeltaDatabaseVariant.B_IMMUTABLE_COW -> auditCandidateMutations(
                            scenario = scenario,
                            baseline = baseline,
                            incoming = incoming,
                        )'''
          if text.count(old) != 1:
              raise SystemExit('candidate rowEvidence block not unique')
          text = text.replace(old, new)

          text = text.replace(
              '"A row mutations are counted in a separate untimed audit-trigger pass so counters cannot inflate timed WAL evidence.",',
              '"A and B row mutations are counted in separate untimed audit-trigger passes so counters cannot inflate timed WAL evidence.",',
          )
          text = text.replace('        val beforeChanges = totalChanges(database)\n', '')
          text = text.replace('        val rowMutations = totalChanges(database) - beforeChanges\n', '')
          text = text.replace('                observedRowMutations = rowMutations,', '                observedRowMutations = 0L,')

          marker = '    private suspend fun prepareRoomBaseline(name: String, baseline: List<RefreshDeltaDatabaseItem>) {'
          if text.count(marker) != 1:
              raise SystemExit('prepareRoomBaseline marker not unique')
          insert = r'''    private fun auditCandidateMutations(
        scenario: RefreshDeltaDatabaseScenario,
        baseline: List<RefreshDeltaDatabaseItem>,
        incoming: List<RefreshDeltaDatabaseItem>,
    ): Map<String, Long> {
        val name = nextDatabaseName("cow-audit", scenario.id, 0)
        cleanup(name)
        val databaseFile = applicationContext.getDatabasePath(name)
        databaseFile.parentFile?.mkdirs()
        val database = SQLiteDatabase.openOrCreateDatabase(databaseFile, null)
        try {
            check(database.enableWriteAheadLogging() || database.isWriteAheadLoggingEnabled)
            database.execSQL("PRAGMA foreign_keys=ON")
            createCandidateSchema(database)
            prepareCandidateBaseline(database, baseline)
            installCandidateAuditTriggers(database)
            checkpoint(database)

            candidateTransaction(database) {
                database.execSQL(
                    "INSERT INTO c03_b_revisions(source_id, revision_number, status) VALUES(?, ?, 'STAGING')",
                    arrayOf<Any?>(SOURCE_ID, REFRESH_REVISION),
                )
            }
            val statements = CandidateStatements(database)
            try {
                incoming.chunked(BATCH_SIZE).forEach { batch ->
                    candidateTransaction(database) {
                        batch.forEach { item -> statements.stage(item, REFRESH_REVISION) }
                    }
                }
            } finally {
                statements.close()
            }
            candidateTransaction(database) {
                database.execSQL(
                    "UPDATE c03_b_revisions SET status='RETAINED' WHERE source_id=? AND status='ACTIVE'",
                    arrayOf(SOURCE_ID),
                )
                database.execSQL(
                    "UPDATE c03_b_revisions SET status='ACTIVE' WHERE source_id=? AND revision_number=? AND status='STAGING'",
                    arrayOf<Any?>(SOURCE_ID, REFRESH_REVISION),
                )
                database.execSQL(
                    "UPDATE c03_b_sources SET retained_revision=active_revision, active_revision=? WHERE id=?",
                    arrayOf<Any?>(REFRESH_REVISION, SOURCE_ID),
                )
            }

            val counts = linkedMapOf<String, Long>()
            database.rawQuery(
                "SELECT table_name, operation, mutation_count FROM c03_b_audit_counts ORDER BY table_name, operation",
                emptyArray(),
            ).use { cursor ->
                while (cursor.moveToNext()) {
                    counts["${cursor.getString(0)}.${cursor.getString(1)}"] = cursor.getLong(2)
                }
            }
            return counts.filterValues { it > 0L }
        } finally {
            database.close()
            cleanup(name)
        }
    }

    private fun installCandidateAuditTriggers(database: SQLiteDatabase) {
        database.execSQL(
            """
            CREATE TABLE c03_b_audit_counts(
                table_name TEXT NOT NULL,
                operation TEXT NOT NULL,
                mutation_count INTEGER NOT NULL DEFAULT 0,
                PRIMARY KEY(table_name, operation)
            )
            """.trimIndent(),
        )
        CANDIDATE_AUDITED_TABLES.forEach { table ->
            AUDITED_OPERATIONS.forEach { operation ->
                database.execSQL(
                    "INSERT INTO c03_b_audit_counts(table_name, operation, mutation_count) VALUES(?, ?, 0)",
                    arrayOf(table, operation),
                )
                val sqlOperation = operation.uppercase(Locale.ROOT)
                database.execSQL(
                    """
                    CREATE TRIGGER c03_b_audit_${table}_${operation}
                    AFTER $sqlOperation ON $table
                    BEGIN
                        UPDATE c03_b_audit_counts
                        SET mutation_count = mutation_count + 1
                        WHERE table_name = '$table' AND operation = '$operation';
                    END
                    """.trimIndent(),
                )
            }
        }
    }

'''
          text = text.replace(marker, insert + marker)

          constants = '''        val AUDITED_OPERATIONS = listOf("insert", "update", "delete")'''
          replacement = '''        val CANDIDATE_AUDITED_TABLES = listOf(
            "c03_b_sources",
            "c03_b_revisions",
            "c03_b_canonical_channels",
            "c03_b_payloads",
            "c03_b_search_payloads",
            "c03_b_revision_entries",
        )
        val AUDITED_OPERATIONS = listOf("insert", "update", "delete")'''
          if text.count(constants) != 1:
              raise SystemExit('AUDITED_OPERATIONS marker not unique')
          text = text.replace(constants, replacement)

          path.write_text(text)
          PY
          git diff --check
          git diff -- core/database/src/debug/kotlin/app/muxtv/database/measurement/RefreshDeltaDatabaseMeasurementRunner.kt

      - name: Enable KVM for Android Emulator
        shell: bash
        env:
          MUXTV_KVM_EVIDENCE: .work/evidence/c03-room/kvm
        run: bash ./tools/ci/Enable-HostedAndroidKvm.sh

      - name: Verify GREEN before commit
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2, 2026-07-05
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          avd-name: MuxTV_TV_CURRENT_API36
          force-avd-creation: true
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 4G
          enable-hw-keyboard: true
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -camera-back none -camera-front none -netdelay none -netspeed full
          script: |
            set -eu
            chmod +x ./gradlew
            rm -rf core/database/build/outputs/androidTest-results/connected/debug
            ./gradlew :core:database:connectedDebugAndroidTest --no-daemon --stacktrace --console=plain --no-problems-report -PcatalogMeasurements=true -Pandroid.testInstrumentationRunnerArguments.class=app.muxtv.database.RefreshDeltaDatabaseMeasurementTest -Pandroid.testInstrumentationRunnerArguments.c03SourceCommit=$C03_EXPECTED_HEAD -Pandroid.testInstrumentationRunnerArguments.c03Warmups=0 -Pandroid.testInstrumentationRunnerArguments.c03Iterations=1
            mkdir -p "$MUXTV_EVIDENCE_DIR"
            remote=/sdcard/Android/data/app.muxtv.database.test/files/c03-room/c03-refresh-delta.json
            adb shell "test -f '$remote'"
            adb pull "$remote" "$MUXTV_EVIDENCE_DIR/precommit-green.json"

      - name: Commit verified measurement fix to C03 branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/database/src/debug/kotlin/app/muxtv/database/measurement/RefreshDeltaDatabaseMeasurementRunner.kt
          git commit -m "fix(c03): audit candidate physical row mutations"
          git push origin HEAD:${C03_BRANCH}
          printf 'committedHead=%s\n' "$(git rev-parse HEAD)" >> "$MUXTV_EVIDENCE_DIR/provenance.txt"

      - name: Upload pre-commit GREEN evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: c03-room-fix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/c03-room/**
            core/database/build/outputs/androidTest-results/**
          retention-days: 7
          github-token: ${{ github.token }}
