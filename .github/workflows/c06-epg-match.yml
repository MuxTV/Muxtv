name: C06 EPG matching evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - 'benchmark/jvm/**'
      - 'benchmark/competitive/**'
      - '.github/workflows/c06-epg-match.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: c06-epg-match-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  correctness:
    name: C06 JVM correctness + JMH compile
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MUXTV_EVIDENCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MUXTV_EVIDENCE_SHA }}
          persist-credentials: false

      - name: Set up MuxTV JDK toolchains
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Assert exact source
        shell: pwsh
        run: |
          & .\tools\ci\Assert-EvidenceCommit.ps1 -ExpectedCommit $env:MUXTV_EVIDENCE_SHA

      - name: Run C06 correctness contract
        shell: pwsh
        run: |
          .\gradlew.bat :benchmark:jvm:test :benchmark:jvm:jmhClasses --no-daemon --stacktrace --console=plain --no-problems-report

      - name: Upload bounded correctness evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: c06-correctness-${{ env.MUXTV_EVIDENCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark/jvm/build/reports/tests/**
            benchmark/jvm/build/test-results/**
            benchmark/jvm/build/reports/c06/**
          retention-days: 7
          github-token: ${{ github.token }}

  performance:
    name: C06 JMH performance after correctness
    needs: correctness
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MUXTV_EVIDENCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MUXTV_EVIDENCE_SHA }}
          persist-credentials: false

      - name: Set up MuxTV JDK toolchains
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Assert exact source
        shell: pwsh
        run: |
          & .\tools\ci\Assert-EvidenceCommit.ps1 -ExpectedCommit $env:MUXTV_EVIDENCE_SHA

      - name: Run correctness-gated C06 JMH
        shell: pwsh
        run: |
          .\gradlew.bat :benchmark:jvm:jmh --no-daemon --stacktrace --console=plain --no-problems-report -PmuxtvC06JmhOnly=true

      - name: Upload bounded JMH evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: c06-jmh-${{ env.MUXTV_EVIDENCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark/jvm/build/reports/jmh/**
          retention-days: 7
          github-token: ${{ github.token }}
