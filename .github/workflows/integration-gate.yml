name: Integration acceptance gate

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: integration-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host:
    name: Integration host Full
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout selected integration SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up MuxTV JDK toolchains
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Verify exact integration commit
        shell: pwsh
        run: |
          & .\tools\ci\Assert-EvidenceCommit.ps1 -ExpectedCommit "${{ github.sha }}"

      - name: Run full host validation once
        shell: pwsh
        env:
          MUXTV_SOURCE_BRANCH: ${{ github.ref_name }}
          MUXTV_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          pwsh -NoProfile -File .\tools\verify-local.ps1 `
            -Mode Full `
            -SourceBranch $env:MUXTV_SOURCE_BRANCH `
            -SourceCommit $env:MUXTV_SOURCE_COMMIT `
            -NoDaemon

      - name: Upload host integration evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: integration-host-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/**/*.json
            .work/evidence/**/*.log
            .work/evidence/**/*.txt
          retention-days: 7
          github-token: ${{ github.token }}

  device:
    name: Integration Android TV API${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            arch: x86
            avd: MuxTV_TV_OLD_API26
            ram: 1536M
          - api: 36
            arch: x86_64
            avd: MuxTV_TV_CURRENT_API36
            ram: 2048M

    steps:
      - name: Checkout selected integration SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up MuxTV JDK toolchains
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Enable KVM for Android Emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run integration Android TV API${{ matrix.api }} matrix
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2, 2026-07-05
        env:
          MUXTV_EXPECTED_AVD: ${{ matrix.avd }}
          MUXTV_DEVICE_EVIDENCE: .work/evidence/integration/api-${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: ${{ matrix.arch }}
          profile: tv_1080p
          avd-name: ${{ matrix.avd }}
          force-avd-creation: true
          cores: 2
          ram-size: ${{ matrix.ram }}
          heap-size: 256M
          disk-size: 4G
          disable-animations: true
          enable-hw-keyboard: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -camera-back none -camera-front none -netdelay none -netspeed full
          script: |
            set -eu
            mkdir -p "$MUXTV_DEVICE_EVIDENCE"
            avdmanager list avd -c | tee "$MUXTV_DEVICE_EVIDENCE/avd-inventory.txt"
            avd_count="$(sed '/^[[:space:]]*$/d' "$MUXTV_DEVICE_EVIDENCE/avd-inventory.txt" | wc -l | tr -d '[:space:]')"
            avd_name="$(sed '/^[[:space:]]*$/d' "$MUXTV_DEVICE_EVIDENCE/avd-inventory.txt" | head -n 1)"
            if [ "$avd_count" -ne 1 ] || [ "$avd_name" != "$MUXTV_EXPECTED_AVD" ]; then
              echo "Expected exactly canonical AVD $MUXTV_EXPECTED_AVD; count=$avd_count first=$avd_name" >&2
              exit 1
            fi
            chmod +x ./gradlew
            ./gradlew \
              :catalog:importer:connectedDebugAndroidTest \
              :catalog:refresh:connectedDebugAndroidTest \
              :core:credentials:connectedDebugAndroidTest \
              :core:database:connectedDebugAndroidTest \
              :player:media3:connectedDebugAndroidTest \
              :app:tv:connectedDebugAndroidTest \
              --no-daemon \
              --stacktrace \
              --console=plain \
              --no-problems-report
            pwsh -NoProfile -File ./tools/ci/Assert-AndroidTestResults.ps1 \
              -OutputPath "$MUXTV_DEVICE_EVIDENCE/android-test-results.json"

      - name: Upload integration device evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: integration-api${{ matrix.api }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/integration/api-${{ matrix.api }}/**
            catalog/importer/build/outputs/androidTest-results/**
            catalog/refresh/build/outputs/androidTest-results/**
            core/credentials/build/outputs/androidTest-results/**
            core/database/build/outputs/androidTest-results/**
            player/media3/build/outputs/androidTest-results/**
            app/tv/build/outputs/androidTest-results/**
          retention-days: 7
          github-token: ${{ github.token }}

  acceptance:
    name: Full + Android TV DeviceMatrix
    if: always()
    needs:
      - host
      - device
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require host and device acceptance
        shell: bash
        env:
          HOST_RESULT: ${{ needs.host.result }}
          DEVICE_RESULT: ${{ needs.device.result }}
        run: |
          set -euo pipefail
          if [[ "$HOST_RESULT" != "success" || "$DEVICE_RESULT" != "success" ]]; then
            echo "Integration acceptance failed: host=$HOST_RESULT device=$DEVICE_RESULT" >&2
            exit 1
          fi
          echo "Integration acceptance passed: Full host + canonical API26/API36 Android TV matrix."
