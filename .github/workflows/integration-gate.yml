name: Integration acceptance gate

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: integration-acceptance-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  integration:
    name: Full + Android TV DeviceMatrix
    runs-on: [self-hosted, Windows, X64, muxtv-android, muxtv-device]
    timeout-minutes: 240

    steps:
      - name: Checkout selected integration SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Clean workspace with Windows long paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw "Failed to enable Git long paths." }
          git reset --hard HEAD
          if ($LASTEXITCODE -ne 0) { throw "Failed to reset workspace." }
          $cleanOutput = (& git clean -ffdx 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Failed to clean workspace.`n$cleanOutput" }
          $dirty = (& git status --porcelain=v1 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw "Workspace remains dirty after reset/clean.`n$dirty" }

      - name: Verify exact integration commit
        shell: pwsh
        run: |
          & .\tools\ci\Assert-EvidenceCommit.ps1 -ExpectedCommit "${{ github.sha }}"

      - name: Preflight integration runner
        shell: pwsh
        run: |
          & .\tools\ci\Assert-SelfHostedRunnerPreflight.ps1 `
            -RequireNoConnectedDevice `
            -ExpectedRunnerLabels muxtv-android,muxtv-device `
            -ExpectedSystemImageApis 26,36

      - name: Initialize Android SDK and validate harness
        shell: pwsh
        run: |
          . .\tools\android\Initialize-AndroidSdkEnvironment.ps1 -PersistForGitHubActions
          & .\tools\android\Test-TvHarnessSyntax.ps1

      - name: Run full host validation once
        shell: pwsh
        env:
          MUXTV_SOURCE_BRANCH: ${{ github.ref_name }}
          MUXTV_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          pwsh -NoProfile -File .\tools\verify-local.ps1 `
            -Mode Full `
            -SourceBranch $env:MUXTV_SOURCE_BRANCH `
            -SourceCommit $env:MUXTV_SOURCE_COMMIT `
            -NoDaemon

      - name: Run Android TV old-edge and current matrix once
        shell: pwsh
        env:
          MUXTV_SOURCE_BRANCH: ${{ github.ref_name }}
          MUXTV_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          & .\tools\android\Invoke-TvDeviceValidation.ps1 `
            -Mode DeviceMatrix `
            -SourceBranch $env:MUXTV_SOURCE_BRANCH `
            -SourceCommit $env:MUXTV_SOURCE_COMMIT `
            -SkipHostValidation `
            -NoDaemon

      - name: Upload integration acceptance evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: integration-acceptance-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/**/*.json
            .work/evidence/**/*.log
            .work/evidence/**/*.txt
            .work/evidence/**/*.png
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          retention-days: 14
          github-token: ${{ github.token }}

      - name: Reset Android runner state
        if: always()
        shell: pwsh
        run: |
          & .\tools\ci\Reset-SelfHostedAndroidState.ps1
