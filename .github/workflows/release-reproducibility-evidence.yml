name: Release reproducibility evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/tv/**'
      - 'gradle/libs.versions.toml'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'build-logic/convention/src/test/kotlin/app/muxtv/buildlogic/ReleaseReproducibilityEvidenceContractTest.kt'
      - 'tools/android/**'
      - 'tools/ci/Assert-EvidenceCommit.ps1'
      - 'tools/release/Invoke-ReleaseReproducibilityEvidence.ps1'
      - '.github/actions/setup-muxtv-jdks/**'
      - '.github/actions/upload-evidence-with-retry/**'
      - '.github/workflows/release-reproducibility-evidence.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: release-reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducibility:
    name: Two-build release reproducibility
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      SOURCE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up MuxTV JDK toolchains
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Initialize Android SDK environment
        shell: pwsh
        run: . .\tools\android\Initialize-AndroidSdkEnvironment.ps1 -PersistForGitHubActions

      - name: Verify release reproducibility contract
        shell: pwsh
        run: |
          .\gradlew.bat -p build-logic :convention:test `
            --tests "app.muxtv.buildlogic.ReleaseReproducibilityEvidenceContractTest" `
            --no-daemon `
            --stacktrace `
            --console=plain `
            --no-problems-report
          if ($LASTEXITCODE -ne 0) { throw "Release reproducibility contract failed." }

      - name: Build twice and compare exact-head release artifacts
        shell: pwsh
        run: |
          & .\tools\release\Invoke-ReleaseReproducibilityEvidence.ps1 `
            -SourceCommit "$env:SOURCE_COMMIT"

      - name: Upload release reproducibility evidence
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: release-reproducibility-${{ env.SOURCE_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/release-reproducibility/**
          retention-days: 7
          github-token: ${{ github.token }}
