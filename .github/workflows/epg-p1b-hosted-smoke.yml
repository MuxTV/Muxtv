name: EPG P1B hosted smoke

on:
  push:
    branches:
      - wip/epg-refresh-access-guard-70
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  compile-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile app and run catalog sync unit tests
        run: ./gradlew :catalog:sync:testDebugUnitTest :app:tv:assembleDebug --no-daemon --stacktrace --console=plain
