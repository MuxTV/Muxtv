name: Temporary Baseline Profile capture for #31

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  actions: read

concurrency:
  group: tmp-baseline-profile-capture-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  capture:
    name: Capture Baseline Profile API36
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'release/31-baseline-profile-packaging-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PROFILE_PATH: app/tv/src/release/generated/baselineProfiles/baseline-prof.txt
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Set up MuxTV JDK toolchains
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Verify exact source and missing profile
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "Baseline Profile capture head mismatch." >&2
            exit 1
          fi
          if [[ -s "$PROFILE_PATH" ]]; then
            echo "Committed Baseline Profile already exists; temporary capture must be removed." >&2
            exit 1
          fi

      - name: Enable KVM for Android Emulator
        shell: bash
        env:
          MUXTV_KVM_EVIDENCE: .work/evidence/baseline-profile-capture-api36
        run: bash ./tools/ci/Enable-HostedAndroidKvm.sh

      - name: Generate release Baseline Profile on canonical API36 TV AVD
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2, 2026-07-05
        env:
          MUXTV_EXPECTED_AVD: MuxTV_TV_CURRENT_API36
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          avd-name: MuxTV_TV_CURRENT_API36
          force-avd-creation: true
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 4G
          disable-animations: true
          enable-hw-keyboard: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -camera-back none -camera-front none -netdelay none -netspeed full
          script: >-
            ./gradlew :app:tv:generateReleaseBaselineProfile
            --no-daemon
            --stacktrace
            --console=plain
            --no-problems-report
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile

      - name: Commit only generated Baseline Profile
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s "$PROFILE_PATH" ]]; then
            echo "Baseline Profile generation produced no committed-source profile." >&2
            exit 1
          fi
          if ! grep -q '^L' "$PROFILE_PATH"; then
            echo "Generated Baseline Profile does not contain class/method rules." >&2
            exit 1
          fi
          git add -- "$PROFILE_PATH"
          staged="$(git diff --cached --name-only)"
          if [[ "$staged" != "$PROFILE_PATH" ]]; then
            echo "Temporary capture attempted to stage unexpected paths." >&2
            printf '%s\n' "$staged" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "perf(release): capture API36 Baseline Profile"
          git push origin HEAD:${{ github.head_ref }}
