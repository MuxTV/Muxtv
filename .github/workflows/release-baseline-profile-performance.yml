name: Release Baseline Profile performance evidence

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-baseline-profile-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    name: Release Baseline Profile performance API36
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up MuxTV JDK toolchains
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Enable KVM for Android Emulator
        shell: bash
        env:
          MUXTV_KVM_EVIDENCE: .work/evidence/release-baseline-profile-performance
        run: bash ./tools/ci/Enable-HostedAndroidKvm.sh

      - name: Compare cold startup with and without Baseline Profile
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2, 2026-07-05
        env:
          MUXTV_EXPECTED_AVD: MuxTV_TV_CURRENT_API36
          MUXTV_BENCHMARK_EVIDENCE: .work/evidence/release-baseline-profile-performance
          MUXTV_SOURCE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          avd-name: MuxTV_TV_CURRENT_API36
          force-avd-creation: true
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 4G
          disable-animations: true
          enable-hw-keyboard: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -camera-back none -camera-front none -netdelay none -netspeed full
          script: bash ./tools/ci/Run-HostedBaselineProfilePerformance.sh

      - name: Upload Baseline Profile performance evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: release-baseline-profile-performance-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/evidence/release-baseline-profile-performance/**
            benchmark/macrobenchmark/build/outputs/androidTest-results/**
            benchmark/macrobenchmark/build/outputs/connected_android_test_additional_output/**
          retention-days: 14
          github-token: ${{ github.token }}
