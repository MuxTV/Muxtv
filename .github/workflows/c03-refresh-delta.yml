name: C03 refresh delta evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - 'benchmark/jvm/**'
      - 'core/database/src/debug/kotlin/app/muxtv/database/measurement/**'
      - 'core/database/src/androidTest/kotlin/app/muxtv/database/**RefreshDelta**'
      - 'tools/ci/Run-HostedC03RefreshDelta.sh'
      - '.github/workflows/c03-refresh-delta.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: c03-refresh-delta-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  jvm-contract:
    name: C03 JVM correctness + focused JMH
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      C03_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.C03_SOURCE_SHA }}
          persist-credentials: false

      - name: Set up MuxTV JDK toolchains
        uses: ./.github/actions/setup-muxtv-jdks

      - name: Assert exact source
        shell: pwsh
        run: |
          & .\tools\ci\Assert-EvidenceCommit.ps1 -ExpectedCommit $env:C03_SOURCE_SHA

      - name: Run C03 JVM correctness contract
        shell: pwsh
        run: |
          .\gradlew.bat :benchmark:jvm:test :benchmark:jvm:jmhClasses --no-daemon --stacktrace --console=plain --no-problems-report
          if ($LASTEXITCODE -ne 0) { throw "C03 JVM correctness failed." }

      - name: Build focused JMH executable
        shell: pwsh
        run: |
          .\gradlew.bat :benchmark:jvm:jmhJar --no-daemon --stacktrace --console=plain --no-problems-report
          if ($LASTEXITCODE -ne 0) { throw "C03 JMH jar build failed." }

      - name: Run C03 regular JMH evidence
        shell: pwsh
        run: |
          $reportDir = Join-Path $PWD "benchmark/jvm/build/reports/jmh/c03"
          New-Item -ItemType Directory -Force -Path $reportDir | Out-Null
          $jmhJar = Get-ChildItem -Path "benchmark/jvm/build/libs" -Filter "*-jmh.jar" | Select-Object -First 1
          if ($null -eq $jmhJar) { throw "C03 JMH executable jar was not produced." }
          $json = Join-Path $reportDir "results.json"
          $human = Join-Path $reportDir "human.txt"
          & java -jar $jmhJar.FullName `
            "app.muxtv.benchmark.RefreshDeltaBenchmark.*" `
            -p "size=1000,10000" `
            -wi 5 `
            -i 5 `
            -f 2 `
            -w 1s `
            -r 1s `
            -prof gc `
            -foe true `
            -rf json `
            -rff $json 2>&1 | Tee-Object -FilePath $human
          if ($LASTEXITCODE -ne 0) { throw "C03 focused JMH execution failed." }
          if (!(Test-Path $json) -or (Get-Item $json).Length -eq 0) { throw "C03 JMH JSON evidence is missing." }

      - name: Upload bounded JVM evidence
        if: always()
        uses: ./.github/actions/upload-evidence-with-retry
        with:
          name-prefix: c03-jvm-${{ env.C03_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark/jvm/build/reports/tests/**
            benchmark/jvm/build/test-results/**
            benchmark/jvm/build/reports/jmh/c03/**
          retention-days: 7
          github-token: ${{ github.token }}
