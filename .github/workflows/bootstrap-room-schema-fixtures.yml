name: Bootstrap Room schema fixtures

on:
  push:
    branches:
      - feat/epg-refresh-state-70

permissions:
  contents: write

jobs:
  bootstrap-room-schemas:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: feat/epg-refresh-state-70

      - name: Restore exact Room v5 and v6 schema exports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $schemaDir = Join-Path $PWD 'core/database/schemas/app.muxtv.database.MuxTvDatabase'
          New-Item -ItemType Directory -Force -Path $schemaDir | Out-Null

          function Expand-GzipBase64([string]$Base64, [string]$Path) {
            [byte[]]$compressed = [Convert]::FromBase64String($Base64)
            $inputStream = [IO.MemoryStream]::new(,$compressed)
            $gzip = [IO.Compression.GZipStream]::new($inputStream, [IO.Compression.CompressionMode]::Decompress)
            $outputStream = [IO.File]::Create($Path)
            try {
              $gzip.CopyTo($outputStream)
            } finally {
              $outputStream.Dispose()
              $gzip.Dispose()
              $inputStream.Dispose()
            }
          }

          $v5 = ''
          $v6 = ''

          $v5Path = Join-Path $schemaDir '5.json'
          $v6Path = Join-Path $schemaDir '6.json'
          Expand-GzipBase64 $v5 $v5Path
          Expand-GzipBase64 $v6 $v6Path

          $v5Hash = (Get-FileHash $v5Path -Algorithm SHA256).Hash.ToLowerInvariant()
          $v6Hash = (Get-FileHash $v6Path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($v5Hash -ne 'e9cdb2916bd51dee33e62e957b0612946fef50d2f383222286719cead0102f10') { throw "Unexpected v5 schema hash: $v5Hash" }
          if ($v6Hash -ne '7468d52b010ad36096e02492c727659df8228cdd336189f2be5a23af9589764a') { throw "Unexpected v6 schema hash: $v6Hash" }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'core/database/schemas/app.muxtv.database.MuxTvDatabase/5.json' 'core/database/schemas/app.muxtv.database.MuxTvDatabase/6.json'
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Exact Room schema fixtures are already committed.'
            exit 0
          }

          git commit -m 'test(database): commit Room v5 and v6 schema fixtures'
          git push origin HEAD:feat/epg-refresh-state-70
