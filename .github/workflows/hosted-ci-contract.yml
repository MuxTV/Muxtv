name: Hosted CI contract

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'tools/ci/Test-GitHubHostedWorkflowContract.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-ci-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: Hosted CI contract
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify GitHub-hosted workflow contract
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\ci\Test-GitHubHostedWorkflowContract.ps1
