name: Hosted CI contract

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/setup-muxtv-jdks/**'
      - 'feature/sources/**'
      - 'catalog/api/**'
      - 'tools/ci/Test-GitHubHostedWorkflowContract.ps1'
      - 'tools/ci/Test-RiskBasedDeviceLaneContract.ps1'
      - 'tools/ci/Test-TvU1FocusedProfileContract.ps1'
      - 'tools/ci/Test-AndroidTestResultsContract.ps1'
      - 'tools/ci/Test-SourcesStablePortContract.ps1'
      - 'tools/ci/Assert-AndroidTestResults.ps1'
      - 'tools/ci/Enable-HostedAndroidKvm.sh'
      - 'tools/ci/Run-HostedAndroidProductTests.sh'
      - 'tools/ci/Run-HostedTvU1ShellTests.sh'
      - 'tools/ci/Run-HostedDatabaseMigrationTests.sh'
      - 'tools/ci/Run-HostedMacrobenchmarkDryRun.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-ci-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: Hosted CI contract
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify hosted Android result parser contract
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\ci\Test-AndroidTestResultsContract.ps1

      - name: Verify hosted device lane contract
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\ci\Test-RiskBasedDeviceLaneContract.ps1

      - name: Verify U1 focused profile isolation contract
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\ci\Test-TvU1FocusedProfileContract.ps1

      - name: Verify Sources stable-port architecture contract
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\ci\Test-SourcesStablePortContract.ps1

      - name: Verify GitHub-hosted workflow contract
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\ci\Test-GitHubHostedWorkflowContract.ps1
