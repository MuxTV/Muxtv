name: Commit Room schema v4

on:
  push:
    branches:
      - feat/source-onboarding-registry

permissions:
  contents: write

concurrency:
  group: room-schema-v4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Generate Room schema
        shell: pwsh
        run: |
          .\gradlew.bat :core:database:kspDebugKotlin --no-daemon
          $schema = "core\database\schemas\app.muxtv.database.MuxTvDatabase\4.json"
          if (-not (Test-Path $schema -PathType Leaf)) {
            throw "Room schema v4 was not generated."
          }
          Copy-Item $schema (Join-Path $env:RUNNER_TEMP "muxtv-room-schema-4.json") -Force

      - name: Checkout branch with push credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/source-onboarding-registry
          persist-credentials: true
          clean: true

      - name: Commit generated schema only
        shell: pwsh
        run: |
          $schemaDirectory = "core\database\schemas\app.muxtv.database.MuxTvDatabase"
          $schema = Join-Path $schemaDirectory "4.json"
          New-Item -ItemType Directory -Force -Path $schemaDirectory | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP "muxtv-room-schema-4.json") $schema -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $schema

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Room schema v4 is already committed."
            exit 0
          }

          git commit -m "chore: commit Room schema v4"
          git push origin HEAD:feat/source-onboarding-registry
