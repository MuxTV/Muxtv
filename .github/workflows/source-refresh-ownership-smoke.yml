name: Source refresh ownership smoke

on:
  push:
    branches:
      - fix/source-refresh-ownership-76
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  red-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile source ownership Android contracts
        run: ./gradlew :core:database:compileDebugAndroidTestKotlin --no-daemon --stacktrace --console=plain

      - name: Run source ownership unit contracts
        run: ./gradlew :catalog:importer:testDebugUnitTest --tests app.muxtv.catalog.importer.CatalogRevisionImporterOwnershipTest :core:database:testDebugUnitTest --tests app.muxtv.database.SourceRefreshEntityRedactionTest --no-daemon --stacktrace --console=plain
